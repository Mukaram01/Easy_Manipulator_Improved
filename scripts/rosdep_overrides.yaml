# Additional rosdep rules to avoid unresolved keys when building the bundled
# Tesseract/TrajOpt workspace on ROS 2 Humble (Ubuntu 22.04) or Jazzy.
# Note: the full Humble bootstrap profile intentionally skips several planning/
# Qt rosdep keys when their provider is an imported source overlay. That skip
# list includes source-only Humble workflow keys such as `tesseract_visualization`,
# `tesseract_support`, `tesseract_examples`, `qt_advanced_docking`, and the
# TrajOpt/Tesseract planning stack, so the
# overrides below focus on keys that should still resolve to OS/ROS packages.
cereal:
  ubuntu: [libcereal-dev]

cereal_vendor:
  ubuntu: [libcereal-dev]

descartes_light:
  ubuntu:
    jammy: [ros-humble-descartes-light]
    noble: [ros-jazzy-descartes-light]

fcl:
  ubuntu: [libfcl-dev]

jsoncpp:
  ubuntu: [libjsoncpp-dev]

libqt5concurrent5:
  ubuntu:
    jammy: [libqt5concurrent5]
    noble: [libqt5concurrent5t64]

libboost-graph-dev:
  ubuntu: [libboost-graph-dev]

libboost-stacktrace-dev:
  ubuntu: [libboost-stacktrace-dev]


gz-rendering7:
  ubuntu:
    jammy: [libignition-rendering6-dev]
    noble: [libgz-rendering7-dev]

moveit_planners_ompl:
  ubuntu:
    jammy: [ros-humble-moveit-planners-ompl]
    noble: [ros-jazzy-moveit-planners-ompl]

trajopt_sco:
  ubuntu:
    jammy: [ros-humble-trajopt-sco]
    noble: [ros-jazzy-trajopt-sco]

opw_kinematics:
  ubuntu:
    jammy: [ros-humble-opw-kinematics]
    noble: [ros-jazzy-opw-kinematics]

openmp:
  ubuntu: [libomp-dev]

osqp:
  # Do not resolve to Jammy libosqp-dev: trajopt 0.33.0 requires OSQP v1 API.
  # Import/build the pinned source provider from dependencies/emd_epd_ws.repos instead.
  ubuntu: []

osqp-eigen:
  ubuntu:
    jammy: [libosqp-eigen-dev]
    noble: [libosqp-eigen-dev]

osqp_vendor:
  # Do not resolve to Jammy libosqp-dev: it exposes the older OSQPWorkspace API.
  # Use the pinned source OSQP provider from dependencies/emd_epd_ws.repos.
  ubuntu: []

ignition-math6:
  ubuntu:
    jammy: [libignition-math6-dev]
    noble: [libgz-math7-dev]

gz-math7:
  ubuntu:
    jammy: [libignition-math6-dev]
    noble: [libgz-math7-dev]

roslib:
  ubuntu:
    jammy: [ros-humble-roslib]
    noble: [ros-jazzy-roslib]

trajopt_ifopt:
  ubuntu:
    jammy: [ros-humble-trajopt-ifopt]
    noble: [ros-jazzy-trajopt-ifopt]

tesseract_common:
  ubuntu:
    jammy: [ros-humble-tesseract-common]
    noble: [ros-jazzy-tesseract-common]

# The planning/task-composer and Qt Studio related keys below remain useful for
# full overlay workspaces, but the default minimal bootstrap profile skips them
# so Humble/Jammy runtime installs do not rely on unreleased or missing apt
# binaries.
tesseract_environment:
  ubuntu:
    jammy: [ros-humble-tesseract-environment]
    noble: [ros-jazzy-tesseract-environment]

tesseract_kinematics:
  ubuntu:
    jammy: [ros-humble-tesseract-kinematics]
    noble: [ros-jazzy-tesseract-kinematics]

tesseract_command_language:
  ubuntu:
    jammy: [ros-humble-tesseract-command-language]
    noble: [ros-jazzy-tesseract-command-language]

tesseract_motion_planners:
  ubuntu:
    jammy: [ros-humble-tesseract-motion-planners]
    noble: [ros-jazzy-tesseract-motion-planners]

tesseract_motion_planners_core:
  ubuntu:
    jammy: [ros-humble-tesseract-motion-planners]
    noble: [ros-jazzy-tesseract-motion-planners]

tesseract_motion_planners_simple:
  ubuntu:
    jammy: [ros-humble-tesseract-motion-planners-simple]
    noble: [ros-jazzy-tesseract-motion-planners-simple]

tesseract_msgs:
  ubuntu:
    jammy: [ros-humble-tesseract-msgs]
    noble: [ros-jazzy-tesseract-msgs]

tesseract_process_managers:
  ubuntu:
    jammy: [ros-humble-tesseract-process-managers]
    noble: [ros-jazzy-tesseract-process-managers]

tesseract:
  ubuntu:
    jammy: [ros-humble-tesseract]
    noble: [ros-jazzy-tesseract]

tesseract_task_composer:
  ubuntu:
    jammy: [ros-humble-tesseract-task-composer]
    noble: [ros-jazzy-tesseract-task-composer]

# Source-overlay-only keys on Humble/Jammy. Keep these explicit no-op mappings
# so `rosdep install --from-paths src --ignore-src` does not fail when the
# corresponding packages are expected to come from the imported workspace.
tesseract_visualization:
  ubuntu: []

tesseract_support:
  ubuntu: []

tesseract_examples:
  ubuntu: []


gz-common5:
  ubuntu:
    jammy: [libignition-common4-dev]
    noble: [libgz-common5-dev]

ruckig:
  # Compatibility note: the workspace baseline is Ubuntu 22.04 / ROS 2 Humble with C++17.
  # Keep source checkouts on the pre-<format> Ruckig line (for example v0.15.3 in
  # dependencies/emd_epd_ws.repos) or use the distro libruckig-dev package instead.
  ubuntu: [libruckig-dev]

ros_industrial_cmake_boilerplate:
  ubuntu:
    jammy: [ros-humble-ros-industrial-cmake-boilerplate]
    noble: [ros-jazzy-ros-industrial-cmake-boilerplate]

tesseract_rosutils:
  ubuntu:
    jammy: [ros-humble-tesseract-rosutils]
    noble: [ros-jazzy-tesseract-rosutils]

taskflow:
  ubuntu: [libtaskflow-dev]

trajopt_sqp:
  ubuntu:
    jammy: [ros-humble-trajopt-sqp]
    noble: [ros-jazzy-trajopt-sqp]

boost_plugin_loader:
  ubuntu:
    jammy: [ros-humble-boost-plugin-loader]
    noble: [ros-jazzy-boost-plugin-loader]


qt_advanced_docking:
  ubuntu:
    jammy: [libqtads-dev]
    noble: [libqtads-dev]

trajopt:
  ubuntu:
    jammy: [ros-humble-trajopt]
    noble: [ros-jazzy-trajopt]

moveit_resources_panda_description:
  ubuntu:
    jammy: [ros-humble-moveit-resources-panda-description]
    noble: [ros-jazzy-moveit-resources-panda-description]


ament_cmake:
  ubuntu:
    jammy: [ros-humble-ament-cmake]
    noble: [ros-jazzy-ament-cmake]

ompl:
  ubuntu: [libompl-dev]


moveit_core:
  ubuntu:
    jammy: [ros-humble-moveit-core]
    noble: [ros-jazzy-moveit-core]


moveit_msgs:
  ubuntu:
    jammy: [ros-humble-moveit-msgs]
    noble: [ros-jazzy-moveit-msgs]
