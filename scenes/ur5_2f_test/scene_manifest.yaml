scene:
  name: ur5_2f_test
  folder: scenes/ur5_2f_test
  package: ur5_2f_test
files:
  environment: environment.yaml
  cell_definition: cell_definition.yaml
  layout: layout/workcell_studio_layout.yaml
  launch: launch/demo.launch.py
  urdf_xacro: urdf/scene.urdf.xacro
  visual_mesh_index: generated/scene_visual_mesh_index.json
  scene3d_gui_smoke: generated/scene3d_gui_smoke.json
robot:
  model: ur5
  planning_group: manipulator
  world_frame: world
  base_frame: base_link
  tool_mount_link: tool0
  ee_link: ee_palm
  home_named_target: home
end_effector:
  type: finger
  model: robotiq_85_gripper
  profile: robotiq_85_gripper
  mount_link: tool0
  grasp_frame: ee_palm
  allowed_touch_links:
  - gripper_base_link
  - gripper_finger1_knuckle_link
  - gripper_finger2_knuckle_link
  - gripper_finger1_finger_link
  - gripper_finger2_finger_link
  - gripper_finger1_inner_knuckle_link
  - gripper_finger2_inner_knuckle_link
  - gripper_finger1_finger_tip_link
  - gripper_finger2_finger_tip_link
environment:
  support_surface_link: table
camera:
  enabled: true
  camera_id: realsense_overhead
  frame_id: realsense_overhead_frame
perception:
  enabled: true
  mode: epd_snapshot
  camera_id: realsense_overhead
  frame_id: realsense_overhead_frame
  expected_frames:
  - realsense_overhead_frame
  - world
  epd_input:
    topic: /easy_perception_deployment/epd_localize_output
    message_type: std_msgs/msg/String
  required_object_classes:
  - part
  confidence_threshold: 0.6
  normalized_output_contract: detected_objects/v1
  input_frame_options:
  - world
  - base_link
task_recipe:
  id: default_task
  name: Perception Pick Place
  type: pick_place
  enabled: true
  mode: simulation_preview
  inputs:
    perception_mode: epd_snapshot
  pick:
    object_source: perception
    perception_source: detected_objects/v1
    pick_zone: pick_zone_main
    grasp_strategy: finger_pinch_basic
    allowed_grasp_methods:
    - finger
  decision_rules:
  - id: default_place
    when:
      always: true
    destination: default_drop_zone
  destinations:
  - id: default_drop_zone
    frame: world
    pose_xyz:
    - 0.55
    - -0.28
    - 0.1
    pose_rpy:
    - 0.0
    - 0.0
    - 0.0
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
