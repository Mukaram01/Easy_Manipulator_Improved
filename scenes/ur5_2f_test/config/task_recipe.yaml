schema_version: task_recipe/v1
task:
  id: default_task
  type: pick_place
  mode: simulation_preview
  source_object: commissioning_object
  object_source: self_test
  inputs:
    perception_mode: "off"
  destinations:
  - id: default_drop_zone
    frame: world
    pose_xyz:
    - 0.5
    - -0.3
    - 0.1
    pose_rpy:
    - 0.0
    - 0.0
    - 0.0
  decision_rules:
  - id: default_place
    when:
      always: true
    destination: default_drop_zone
  notes: Commissioning canary pick/place task for offline validation. Preview-safe.
provenance:
  mode: generated_readiness_metadata
  sources:
  - cell_definition.yaml
  - environment.yaml
