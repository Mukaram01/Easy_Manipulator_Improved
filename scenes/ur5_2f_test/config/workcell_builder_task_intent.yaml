schema: workcell_builder_task_intent/v1
scene_package: scenes/ur5_2f_test
task:
  id: default_task
  type: pick_place
  family: pick_place
  mode: simulation_preview
pick:
  object_source: perception
  source:
    type: perception
    id: detected_objects/v1
  zone:
    type: pick_zone
    id: pick_zone_main
  object_filter:
    class_id: bottle
    # The current EPD localization message does not carry a confidence score.
    # A null threshold keeps the source contract honest; a numeric threshold
    # can be authored when the selected perception adapter provides one.
    min_confidence: null
    max_age_seconds: 2.0
perception:
  source_contract: detected_objects/v1
  camera:
    id: realsense_overhead
place:
  target:
    type: destination
    id: default_drop_zone
    frame: world
    region_ref: default_drop_zone
  release_strategy: tool_release
  retreat_axis: z_up
  retreat_distance_m: 0.1
grasp:
  strategy_ref: top_2f
  approach_axis: z_down
  approach_distance_m: 0.12
  retreat_axis: z_up
  retreat_distance_m: 0.15
safety:
  preview_only: true
  use_fake_hardware: true
  execution_mode: simulation_preview
  no_robot_motion: true
  metadata_only: true
  runtime_io_applied: false
  motion_started: false
  ros_launch_started: false
provenance:
  mode: generated_readiness_metadata
  sources:
  - environment.yaml
routing:
  rules:
  - id: default_place
    when:
      always: true
    destination: default_drop_zone
