controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur5_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ur5_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

ur5_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # Explicitly select the safe future-default behavior and avoid Humble's
    # deprecation warning about accepting non-zero final trajectory velocity.
    allow_nonzero_velocity_at_trajectory_end: false

ur5_gripper_controller:
  ros__parameters:
    joints:
      - gripper_finger1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
