schema_version: cell_definition/v1
cell:
  id: ur5_2f_test
  name: ur5_2f_test
robot:
  model: ur5
  planning_group: manipulator
  world_frame: world
  base_frame: base_link
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
end_effector:
  id: robotiq_85_gripper
  type: finger
  model: robotiq_85_gripper
  profile: robotiq_85_gripper
  mount_link: tool0
  grasp_frame: ee_palm
camera:
  enabled: true
  camera_id: realsense_overhead
  frame_id: realsense_overhead_frame
perception:
  enabled: true
  mode: epd_snapshot
  camera_id: realsense_overhead
  frame_id: realsense_overhead_frame
  expected_frames:
  - realsense_overhead_frame
  - world
  epd_input:
    topic: /easy_perception_deployment/epd_localize_output
    message_type: std_msgs/msg/String
  required_object_classes:
  - part
  confidence_threshold: 0.6
  normalized_output_contract: detected_objects/v1
environment:
  frame: world
  layout: layout/workcell_studio_layout.yaml
  support_surfaces:
  - id: support_surface_table
    type: table
    frame: world
    pose_xyz:
    - 0.55
    - 0.0
    - 0.0
    pose_rpy:
    - 0.0
    - 0.0
    - 0.0
    dimensions:
    - 1.2
    - 0.8
    - 0.08
objects: []
task:
  id: default_task
  type: pick_place
  object_source: perception
  perception_source: detected_objects/v1
  pick_zone: pick_zone_main
  destinations:
  - id: default_drop_zone
    frame: world
    pose_xyz:
    - 0.55
    - -0.28
    - 0.1
    pose_rpy:
    - 0.0
    - 0.0
    - 0.0
  rules:
  - id: default_place
    when:
      always: true
    destination: default_drop_zone
commissioning:
  self_test_enabled: false
  export_bundle: false
