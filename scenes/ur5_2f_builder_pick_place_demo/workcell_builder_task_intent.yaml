schema: workcell_builder_task_intent/v1
scene_package: scenes/ur5_2f_builder_pick_place_demo
task:
  id: sorting_task_001
  type: pick_place
  mode: offline_preview
pick:
  source:
    type: zone
    id: pick_zone_main
  object_filter:
    class_id: box
    color: red
grasp:
  strategy_ref: finger_pinch_basic
  approach_axis: z_down
  approach_distance_m: 0.12
  retreat_axis: z_up
  retreat_distance_m: 0.10
place:
  target:
    type: destination
    id: bin_red
  release_strategy: tool_release
  retreat_axis: z_up
  retreat_distance_m: 0.10
routing:
  rules:
    - id: route_red_box_to_bin_red
      when:
        object_class: box
        object_color: red
      destination: bin_red
safety:
  metadata_only: true
  runtime_io_applied: false
  motion_started: false
  ros_launch_started: false
