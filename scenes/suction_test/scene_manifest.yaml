scene:
  name: suction_test
  folder: scenes/suction_test
  package: suction_test

files:
  environment: environment.yaml
  cell_definition: cell_definition.yaml
  layout: layout/workcell_studio_layout.yaml
  launch: launch/demo.launch.py
  urdf_xacro: urdf/scene.urdf.xacro
  visual_mesh_index: generated/scene_visual_mesh_index.json
  scene3d_gui_smoke: generated/scene3d_gui_smoke.json

robot:
  model: ur5
  planning_group: manipulator
  base_frame: base_link
  ee_link: wrist_fixture
  home_named_target: home

end_effector:
  id: single_suction
  type: suction
  brand: single_suction_gripper
  grasp_frame: wrist_fixture
  allowed_touch_links:
    - wrist_fixture
    - suction_cup_link

environment:
  support_surface_link: table

perception:
  input_frame_options:
    - world
    - base_link

self_test:
  # Commissioning defaults for deterministic offline checks.
  # Tune these values for each physical workcell before production.
  enabled: true
  object:
    id: commissioning_object
    shape: box
    dimensions: [0.05, 0.05, 0.05]
    frame_id: world
    pose_xyz: [0.43, 0.04, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
    attributes:
      class: "part"
      colour: "unknown"
      shape: "box"
      material: "plastic"
  expected:
    min_grasp_candidates: 1
    allow_simulated_execution: true

task_recipe:
  # Mirrors cell_definition.yaml and config/task_recipe.yaml for offline commissioning preview.
  # Metadata-only in this release: no runtime, GUI, replay, live EPD, or perception-backed routing readiness is claimed here.
  id: default_task
  name: Default Pick Place Commissioning Task
  type: pick_place
  enabled: true
  inputs:
    perception_mode: off
  pick:
    object_source: self_test
    source_object: commissioning_object
    grasp_strategy: suction_only
    allowed_grasp_methods: [suction]
  decision_rules:
    - id: default_place
      when:
        always: true
      destination: default_drop_zone
  destinations:
    - id: default_drop_zone
      frame_id: world
      pose_xyz: [0.5, -0.3, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
