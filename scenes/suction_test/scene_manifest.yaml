scene:
  name: suction_test
  folder: scenes/suction_test
  package: suction_test

files:
  environment: environment.yaml
  cell_definition: cell_definition.yaml
  layout: layout/workcell_studio_layout.yaml
  launch: launch/demo.launch.py
  urdf_xacro: urdf/scene.urdf.xacro
  visual_mesh_index: generated/scene_visual_mesh_index.json
  scene3d_gui_smoke: generated/scene3d_gui_smoke.json

robot:
  model: ur5
  planning_group: manipulator
  base_frame: base_link
  ee_link: wrist_fixture
  home_named_target: home

end_effector:
  id: single_suction
  type: suction
  brand: single_suction_gripper
  grasp_frame: wrist_fixture
  allowed_touch_links:
    - wrist_fixture
    - suction_cup_link

environment:
  support_surface_link: table

perception:
  enabled: true
  mode: epd_snapshot
  camera_id: realsense_suction_overhead
  frame_id: camera_color_optical_frame
  expected_frames:
  - camera_color_optical_frame
  - world
  epd_input:
    topic: /easy_perception_deployment/epd_localize_output
    message_type: std_msgs/msg/String
  required_object_classes:
  - part
  confidence_threshold: 0.6
  normalized_output_contract: detected_objects/v1
  input_frame_options:
    - world
    - base_link

task_recipe:
  # Mirrors cell_definition.yaml and config/task_recipe.yaml for authoring preview.
  id: default_task
  name: Perception Pick Place
  type: pick_place
  enabled: true
  inputs:
    perception_mode: epd_snapshot
  pick:
    object_source: perception
    perception_source: detected_objects/v1
    pick_zone: pick_zone_main
    grasp_strategy: suction_only
    allowed_grasp_methods: [suction]
  decision_rules:
    - id: default_place
      when:
        always: true
      destination: default_drop_zone
  destinations:
    - id: default_drop_zone
      frame_id: world
      pose_xyz: [0.5, -0.3, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
