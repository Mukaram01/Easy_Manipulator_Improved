scene:
  name: suction_test

robot:
  model: ur5
  planning_group: manipulator
  base_frame: base_link
  ee_link: wrist_fixture
  home_named_target: home

end_effector:
  type: suction
  brand: single_suction_gripper
  grasp_frame: wrist_fixture
  allowed_touch_links:
    - wrist_fixture
    - suction_cup_link

environment:
  support_surface_link: table

perception:
  input_frame_options:
    - world
    - base_link

self_test:
  # Commissioning defaults for deterministic offline checks.
  # Tune these values for each physical workcell before production.
  enabled: true
  object:
    id: commissioning_box
    shape: box
    dimensions: [0.05, 0.05, 0.05]
    frame_id: world
    pose_xyz: [0.43, 0.04, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
  expected:
    min_grasp_candidates: 1
    allow_simulated_execution: true

task_recipe:
  # Future runtime/UI contract example plus commissioning defaults.
  # Metadata-only in this release: validation/reporting only.
  id: reject_or_place_demo
  name: Reject Or Place Demo
  type: reject
  enabled: true
  inputs:
    perception_source: epd
    required_attributes: [class, quality]
  pick:
    object_source: perception
    grasp_strategy: suction_only
    allowed_grasp_methods: [suction]
  decision_rules:
    - id: accepted_to_good_bin
      when:
        attribute: quality
        equals: accepted
      destination: good_bin
    - id: default_reject
      when:
        default: true
      destination: reject_bin
  destinations:
    - id: good_bin
      frame_id: world
      pose_xyz: [0.32, 0.22, 0.12]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
    - id: reject_bin
      frame_id: world
      pose_xyz: [0.20, -0.02, 0.12]
      pose_rpy: [0.0, 0.0, 0.0]
      action: reject
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
