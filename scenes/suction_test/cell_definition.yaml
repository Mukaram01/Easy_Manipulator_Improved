schema_version: cell_definition/v1
cell:
  id: suction_test
  name: suction_test
robot:
  model: ur5
  planning_group: manipulator
  base_frame: world
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
end_effector:
  id: suction
  type: suction
  brand: generic
  grasp_frame: tool0
camera:
  enabled: true
  camera_id: realsense_suction_overhead
  frame_id: camera_color_optical_frame
perception:
  enabled: true
  mode: epd_snapshot
  camera_id: realsense_suction_overhead
  frame_id: camera_color_optical_frame
  expected_frames:
    - camera_color_optical_frame
    - world
  epd_input:
    topic: /easy_perception_deployment/epd_localize_output
    message_type: std_msgs/msg/String
  required_object_classes:
    - part
  confidence_threshold: 0.6
environment:
  frame: world
  layout: layout/workcell_studio_layout.yaml
objects:
  - id: commissioning_object
    frame: world
    pose_xyz: [0.43, 0.04, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
    dimensions: [0.05, 0.05, 0.05]
task:
  id: default_task
  type: pick_place
  source_object: commissioning_object
  destinations:
    - id: default_drop_zone
      frame: world
      pose_xyz: [0.5, -0.3, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
  rules:
    - id: default_place
      when:
        always: true
      destination: default_drop_zone
commissioning:
  self_test_enabled: true
  export_bundle: false
