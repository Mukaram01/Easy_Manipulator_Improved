scene:
  name: ur5_3f_test
  folder: scenes/ur5_3f_test
  package: ur5_3f_test

files:
  environment: environment.yaml
  cell_definition: cell_definition.yaml
  layout: layout/workcell_studio_layout.yaml
  launch: launch/demo.launch.py
  urdf_xacro: urdf/scene.urdf.xacro
  visual_mesh_index: generated/scene_visual_mesh_index.json
  scene3d_gui_smoke: generated/scene3d_gui_smoke.json

robot:
  model: ur5
  planning_group: manipulator
  base_frame: base_link
  ee_link: palm
  home_named_target: home

end_effector:
  type: finger
  brand: robotiq_3f_gripper
  model: robotiq_3f
  capability: robotiq_3f
  grasp_frame: palm
  allowed_touch_links:
    - palm
    - finger_1_link_0
    - finger_1_link_1
    - finger_1_link_2
    - finger_1_link_3
    - finger_2_link_0
    - finger_2_link_1
    - finger_2_link_2
    - finger_2_link_3
    - finger_middle_link_0
    - finger_middle_link_1
    - finger_middle_link_2
    - finger_middle_link_3

environment:
  support_surface_link: table

perception:
  input_frame_options:
    - world
    - base_link

self_test:
  # Commissioning defaults for deterministic offline checks.
  # Tune these values for each physical workcell before production.
  enabled: true
  object:
    id: commissioning_box
    shape: box
    dimensions: [0.05, 0.05, 0.05]
    frame_id: world
    pose_xyz: [0.44, -0.02, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
    attributes:
      class: "part"
      colour: "unknown"
      shape: "box"
      material: "plastic"
  expected:
    min_grasp_candidates: 1
    allow_simulated_execution: true

task_recipe:
  # Future runtime/UI contract example plus commissioning defaults.
  # Metadata-only in this release: validation/reporting only.
  id: shape_sort_demo
  name: Shape Sort Demo
  type: sort
  enabled: true
  inputs:
    perception_source: epd
    required_attributes: [class, shape]
  pick:
    object_source: perception
    grasp_strategy: auto
    allowed_grasp_methods: [finger]
  decision_rules:
    - id: cylinder_to_lane_a
      when:
        attribute: shape
        equals: cylinder
      destination: lane_a
    - id: box_to_lane_b
      when:
        attribute: shape
        equals: box
      destination: lane_b
    - id: default_reject
      when:
        default: true
      destination: reject_bin
  destinations:
    - id: lane_a
      frame_id: world
      pose_xyz: [0.33, -0.30, 0.12]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
    - id: lane_b
      frame_id: world
      pose_xyz: [0.33, 0.30, 0.12]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
    - id: reject_bin
      frame_id: world
      pose_xyz: [0.18, 0.0, 0.12]
      pose_rpy: [0.0, 0.0, 0.0]
      action: reject
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
