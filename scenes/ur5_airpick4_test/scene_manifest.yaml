scene:
  name: ur5_airpick4_test

robot:
  model: ur5
  planning_group: manipulator
  base_frame: base_link
  ee_link: gripper_base_link
  home_named_target: home

end_effector:
  type: suction
  brand: onrobot_airpick4_description
  grasp_frame: gripper_base_link
  allowed_touch_links:
    - gripper_base_link

environment:
  support_surface_link: table

perception:
  input_frame_options:
    - world
    - base_link

self_test:
  # Commissioning defaults for deterministic offline checks.
  # Tune these values for each physical workcell before production.
  enabled: true
  object:
    id: commissioning_box
    shape: box
    dimensions: [0.05, 0.05, 0.05]
    frame_id: world
    pose_xyz: [0.46, 0.03, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
    attributes:
      class: "light_part"
      colour: "unknown"
      shape: "box"
      material: "cardboard"
  expected:
    min_grasp_candidates: 1
    allow_simulated_execution: true

task_recipe:
  # Future runtime/UI contract example plus commissioning defaults.
  # Metadata-only in this release: validation/reporting only.
  id: light_part_binning_demo
  name: Light Part Binning Demo
  type: binning
  enabled: true
  inputs:
    perception_source: epd
    required_attributes: [class, weight_class]
  pick:
    object_source: perception
    grasp_strategy: suction_priority
    allowed_grasp_methods: [suction]
  decision_rules:
    - id: lightweight_to_bin_small
      when:
        attribute: weight_class
        equals: light
      destination: bin_small
    - id: standard_to_bin_large
      when:
        attribute: weight_class
        equals: standard
      destination: bin_large
    - id: default_stage
      when:
        default: true
      destination: staging_bin
  destinations:
    - id: bin_small
      frame_id: world
      pose_xyz: [0.34, -0.27, 0.11]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
    - id: bin_large
      frame_id: world
      pose_xyz: [0.34, 0.27, 0.11]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
    - id: staging_bin
      frame_id: world
      pose_xyz: [0.20, 0.0, 0.11]
      pose_rpy: [0.0, 0.0, 0.0]
      action: stage
  expected:
    allow_offline_validation: true
    min_valid_destinations: 1
