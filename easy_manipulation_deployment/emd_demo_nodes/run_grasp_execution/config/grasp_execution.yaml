grasp_execution_node:
  ros__parameters:
    planning_frame: "world"
    workcell_context: config/workcell_context.yaml
    planning_scene_monitor_options:
      name: "planning_scene_monitor"
      robot_description: "robot_description"
      joint_state_topic: "/joint_states"
      attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
      publish_planning_scene_topic: "/moveit_cpp/publish_planning_scene"
      monitored_planning_scene_topic: "/moveit_cpp/monitored_planning_scene"
      wait_for_initial_state_timeout: 10.0

    planning_strategy:
      cartesian_planning:
        move_step_length: 0.01
        collide_step_length: 0.0005
      cartesian_non_deterministic_hybrid:
        backtrack_steps: 20
        max_planning_tries: 5
      non_deterministic:
        max_planning_tries: 5
    
    planning_pipelines:
      #namespace: "moveit_cpp"  # optional, default is ~
      pipeline_names: ["ompl"]
    
    plan_request_params:
      planning_attempts: 1
      planning_time: 1.0
      planning_pipeline: ompl
      max_velocity_scaling_factor: 1.0
      max_acceleration_scaling_factor: 1.0

    # Extra timeout headroom (seconds) added by grasp_execution/DefaultExecutor
    # on top of MoveIt trajectory_execution timeout computation. This prevents
    # immediate timeout/cancel when the controller has already reported SUCCEEDED.
    execution_timeout_padding_s: 0.5

    # --- Release pose configuration ---
    # x-axis offset (metres) applied to the current end-effector position to
    # determine the drop-off point. Negative values move the arm in the
    # negative x direction (away from the workspace centre by default).
    release_x_offset: -0.3

    # When true the release pose z-height is aligned to the grasped object's
    # z-height so the arm clears any surface on the return move.
    release_use_grasp_z: true

    # --- Home return configuration ---
    # Optional safe intermediate joint waypoint between detach and home.
    home_return:
      use_safe_intermediate: false
      max_attempts: 5
      safe_joint_state: []
      planning_time: 2.0

    # Optional simple workspace filter to reject unreachable grasp candidates
    # before invoking OMPL.
    grasp_workspace_filter:
      enabled: false
      min_x: -1.0
      max_x: 1.0
      min_y: -1.0
      max_y: 1.0
      min_z: 0.0
      max_z: 1.5
