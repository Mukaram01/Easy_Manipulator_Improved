grasp_planning_node:
  ros__parameters:
    grasp_output_service: "grasp_requests"
    table_to_camera_height: 0.65
    easy_perception_deployment:
      epd_enabled: false
      tracking_enabled: false
      # Default matches EPD output namespace; remap if using a different deployment namespace.
      epd_localization_topic: "/easy_perception_deployment/epd_localize_output"
      epd_tracking_topic: "/processor/epd_tracking_output"
      epd_service: "epd_perception_service"
      epd_detection_topic: ""
      epd_detection_depth_topic: "/camera/depth/image_rect_raw"
      epd_detection_camera_info_topic: "/camera/color/camera_info"
      epd_msg_timeout_s: 5.0
      epd_service_wait_timeout_s: 1.0
    camera_parameters:
      point_cloud_topic: "/camera/camera/depth/color/points"
      camera_frame: "camera_color_optical_frame"
      # Larger queue sizes trade memory/latency for fewer TF filter drops.
      tf_filter_queue_size: 20
      fx: 610.3740844726562
      fy: 609.8685913085938
      ppx: 323.3077697753906
      ppy: 235.43516540527344
    point_cloud_params:
      passthrough_filter_limits_x: [-0.50, 0.50]
      passthrough_filter_limits_y: [-0.15, 0.10]
      passthrough_filter_limits_z: [0.01, 0.70]
      segmentation_max_iterations: 80
      segmentation_distance_threshold: 0.008
      cluster_tolerance: 0.008
      min_cluster_size: 300
      cloud_normal_radius: 0.02
      normal_estimation_threads: 0
      fcl_voxel_size: 0.005
      octomap_resolution: 0.01
    end_effectors:
      end_effector_names: [suction_cup]
      suction_cup:
        type: suction
        num_cups_length: 1
        num_cups_breadth: 1
        dist_between_cups_length: 0.06
        dist_between_cups_breadth: 0.06
        cup_radius: 0.005
        cup_height: 0.01
        gripper_coordinate_system:
          length_direction: "x"
          breadth_direction: "y"
          grasp_approach_direction: "z"
        grasp_planning_params:
          num_sample_along_axis: 3
          search_resolution: 0.006
          search_angle_resolution: 6
          weights:
            curvature: 1.0
            grasp_distance_to_center: 1.4
            number_contact_points: 1.3
    visualization_params:
      point_cloud_visualization: false
