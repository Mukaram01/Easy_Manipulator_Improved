grasp_planning_node:
  ros__parameters:
    grasp_output_service: "grasp_requests"
    execution_in_progress_gate_enabled: true
    table_to_camera_height: 0.65
    grasp_planner_allow_target_fingertip_contact: true
    grasp_planner_allowed_target_touch_links:
      - gripper_finger1_finger_tip_link
      - gripper_finger2_finger_tip_link
    grasp_planner_allowed_target_touch_link_patterns:
      - gripper_finger*_finger_tip_link
    easy_perception_deployment:
      epd_localization_topic: "/easy_perception_deployment/epd_localize_output"
      epd_tracking_topic: "/easy_perception_deployment/epd_tracking_output"
      epd_service: "epd_perception_service"
      epd_enabled: true
      tracking_enabled: false
      epd_detection_topic: ""
      epd_detection_depth_topic: "/camera/depth/image_rect_raw"
      epd_detection_camera_info_topic: "/camera/color/camera_info"
      epd_msg_timeout_s: 5.0
      epd_service_wait_timeout_s: 1.0
      pause_epd_triggers_while_execution_in_progress: true
      epd_subscription_reliability: "best_effort"
    camera_parameters:
      point_cloud_topic: "/camera/camera/depth/color/points"
      camera_frame: "camera_depth_optical_frame"
      # Larger queue sizes trade memory/latency for fewer TF filter drops.
      tf_filter_queue_size: 20
      point_cloud_subscription_reliability: "best_effort"
      robot_base_frame: "base_link"
      fx: 610.3740844726562
      fy: 609.8685913085938
      ppx: 323.3077697753906
      ppy: 235.43516540527344
    point_cloud_params:
      passthrough_filter_limits_x: [-0.50, 0.50]
      passthrough_filter_limits_y: [-0.15, 0.10]
      passthrough_filter_limits_z: [0.01, 0.70]
      segmentation_max_iterations: 80
      segmentation_distance_threshold: 0.008
      cluster_tolerance: 0.008
      min_cluster_size: 300
      cloud_normal_radius: 0.02
      normal_estimation_threads: 0
      fcl_voxel_size: 0.01
      octomap_resolution: 0.01
      min_processing_period_ms: 0
    end_effectors:
      end_effector_names: [robotiq_2f]
      robotiq_2f:
        type: finger
        num_fingers_side_1: 1
        num_fingers_side_2: 1
        distance_between_fingers_1: 0.0
        distance_between_fingers_2: 0.0
        finger_thickness: 0.012
        gripper_stroke: 0.085
        gripper_coordinate_system:
          grasp_stroke_direction: "x"
          grasp_stroke_normal_direction: "y"
          grasp_approach_direction: "z"
        grasp_planning_params:
          grasp_plane_dist_limit: 0.004
          voxel_size: 0.0075
          grasp_rank_weight_1: 2.0
          grasp_rank_weight_2: 1.2
          centroid_dist_penalty_weight: 0.0
          wrist_rotation_penalty_weight: 0.0
          preferred_wrist_roll: 0.0
          preferred_wrist_pitch: 0.0
          preferred_wrist_yaw: 0.0
          world_x_angle_threshold: 0.65
          world_y_angle_threshold: 0.65
          world_z_angle_threshold: 0.35
    visualization_params:
      point_cloud_visualization: false
      point_cloud_visualization_backend: "pcl"
      point_cloud_visualization_blocking: false
      point_cloud_visualization_timeout_ms: 2000
      point_cloud_visualization_save_debug_pcd: false
      point_cloud_visualization_debug_dir: "/tmp/emd_grasp_visualization"
