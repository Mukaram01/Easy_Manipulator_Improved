<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workcell Studio Product View</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="simple_product_ui.css" />
  <link rel="stylesheet" href="contextual_placement_actions.css" />
  <script src="./product_view_runtime_preflight.js"></script>
  <script src="./viewer_lifecycle_bridge.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="product-title">
      <h1>Product View</h1>
      <p>Arrange, review and validate the workcell scene.</p>
    </div>
    <div class="toolbar" aria-label="Product View actions">
      <label class="file-picker primary-action">
        Open scene
        <input id="scene-file" type="file" accept="application/json,.json" />
      </label>
      <button id="reset-view" class="toolbar-button" type="button" disabled title="Fit Scene / Reset View: recomputes and reapplies the fitted workcell overview from renderable bounds." aria-label="Fit Scene / Reset View">Fit</button>
      <select id="camera-preset" class="toolbar-button" disabled title="Apply a deterministic Product View camera preset" aria-label="Camera preset">
        <option value="">View presets</option>
        <option value="isometric">Isometric</option>
        <option value="front">Front</option>
        <option value="top">Top</option>
        <option value="robot">Robot</option>
      </select>
      <button id="undo-edit" class="toolbar-button" type="button" disabled>Undo</button>
      <button id="redo-edit" class="toolbar-button" type="button" disabled>Redo</button>
      <label class="toolbar-number" title="Choose whether Move and Rotate axes follow the workcell or the selected object">
        Space
        <select id="transform-space" aria-label="Transform space">
          <option value="world" selected>World</option>
          <option value="local">Local</option>
        </select>
      </label>
      <button id="export-edit-patch" class="toolbar-button primary-action" type="button" disabled title="Export preview changes as an edit patch">Export edits</button>
      <span id="task-gizmo-slot" class="task-gizmo-slot" aria-live="polite"></span>
      <details id="more-tools" class="toolbar-more">
        <summary>More</summary>
        <div class="toolbar-more-panel">
          <button id="clear-edits" class="toolbar-button" type="button" disabled>Clear edits</button>
          <label class="toolbar-toggle" title="Snap editable preview transforms to grid increments">
            <input id="snap-toggle" type="checkbox" checked />
            Snap
          </label>
          <label class="toolbar-number" title="Translation snap increment in meters">
            Move snap (m)
            <input id="translation-snap" type="number" min="0" step="0.005" value="0.01" />
          </label>
          <label class="toolbar-number" title="Rotation snap increment in degrees">
            Turn snap (deg)
            <input id="rotation-snap" type="number" min="0" step="1" value="5" />
          </label>
          <label class="toolbar-toggle" title="Show read-only object labels in the viewer">
            <input id="labels-toggle" type="checkbox" />
            Object labels
          </label>
          <label class="toolbar-toggle" title="Show zones and helper/debug overlay geometry in the viewer">
            <input id="debug-overlays-toggle" type="checkbox" />
            Zones and helpers
          </label>
          <label class="toolbar-toggle" title="Preview the selected robot at its configured initial joint pose. This does not command the robot.">
            <input id="show-initial-pose" type="checkbox" disabled />
            Robot initial pose
          </label>
        </div>
      </details>
    </div>
  </header>

  <main class="app-shell">
    <aside class="object-panel" aria-label="Scene items panel">
      <h2>Scene items</h2>
      <details id="scene-details" class="panel-disclosure">
        <summary>Scene details</summary>
        <div class="panel-disclosure-content">
          <div id="scene-meta" class="meta-grid"></div>
        </div>
      </details>
      <details id="task-status-panel" class="panel-disclosure">
        <summary>Task status</summary>
        <div class="panel-disclosure-content">
          <div id="task-summary"></div>
        </div>
      </details>
      <div class="list-search-row">
        <input id="object-search" type="search" placeholder="Find scene item" aria-label="Find scene item" />
      </div>
      <div id="object-list" class="object-list"></div>
    </aside>

    <section class="viewer-shell" aria-label="3D Product View">
      <div id="viewer" class="viewer"></div>
      <div id="viewer-status" class="viewer-status" role="status" aria-live="polite"></div>
      <div id="selection-actions" class="selection-actions" hidden>
        <span id="selection-action-label"></span>
        <button id="selection-move" type="button">Move</button>
        <button id="selection-rotate" type="button">Rotate</button>
        <button id="selection-inspect" type="button">Inspect</button>
      </div>
    </section>

    <aside class="inspector-panel" aria-label="Inspector panel">
      <h2>Inspector</h2>
      <div id="inspector-empty" class="empty-state">Select an item to inspect it.</div>
      <div id="inspector" hidden></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="status-message">Ready</span>
    <span id="dirty-state"></span>
  </footer>

  <script type="module">
    const viewerBuild = 'WORKCELL_VIEWER_BUILD_SHA256';
    if (!/^[a-f0-9]{64}$/.test(viewerBuild)) {
      console.error('Invalid Product View bundle build token:', viewerBuild);
    }
    import(`./dist/viewer.bundle.js?v=${viewerBuild}`).catch(error => {
      console.error('Product View bundle failed to load', error);
      const status = document.getElementById('viewer-status');
      if (status) status.textContent = `Product View failed to load: ${error?.message || error}`;
    });
  </script>
</body>
</html>
