name: Web 3D Visual Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/web3d-visual-acceptance.yml
      - scripts/run_workcell_web3d_visual_acceptance.py
      - scripts/run_workcell_studio_scene_readiness_matrix.py
      - scripts/export_workcell_studio_web_scene.py
      - scripts/check_workcell_web_scene_mesh_contract.py
      - scripts/check_workcell_web_scene_visual_bounds.py
      - scripts/extract_scene_urdf_visual_mesh_index.py
      - workcell_studio_web/**
      - tests/test_workcell_web3d_visual_acceptance.py
      - tests/test_workcell_studio_web_viewer_static.py
      - scenes/**

jobs:
  browser-proof:
    name: Browser Product View supported-scenes matrix
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test, xacro and browser tooling
        run: python3 -m pip install --upgrade pip pytest playwright pyyaml xacro==2.1.1

      - name: Initialize blocked matrix artifact
        run: |
          mkdir -p build
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = {
              'schema': 'workcell_studio_web3d_supported_scenes_acceptance_matrix/v1',
              'sequential': True,
              'status': 'BLOCKED',
              'failure_reason': 'Workflow preflight has not completed yet.',
              'counts': {'PASS': 0, 'FAIL': 0, 'BLOCKED': 0},
              'catalog_errors': [],
              'scenes': [],
              'scene_switch_sequence': [],
          }
          Path('build/web3d_supported_scenes_matrix.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Preflight real xacro discovery
        run: |
          set +e
          output=$(python3 - <<'PY' 2>&1

          import importlib.metadata
          import importlib.util
          import sys
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'scripts'))
          import extract_scene_urdf_visual_mesh_index as extractor

          spec = importlib.util.find_spec('xacro')
          if spec is None:
              raise SystemExit('real Python xacro module is unavailable')
          print('xacro module:', spec.origin)
          print('xacro version:', importlib.metadata.version('xacro'))
          command, available, reason = extractor.discover_xacro_command()
          print('discover_xacro_command:', command, available, reason)
          if not available or not command:
              raise SystemExit(f'real xacro command was not discoverable: {reason}')
          if command[0] == 'xacro-lite' or any('xacro-lite' in str(part) for part in command):
              raise SystemExit(f'xacro-lite cannot satisfy supported-scenes acceptance: {command}')
          PY
          )
          rc=$?
          if [ $rc -ne 0 ]; then
            MATRIX_FAILURE_REASON="Preflight real xacro discovery failed: $output" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('build/web3d_supported_scenes_matrix.json')
          report = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          report.update(status='BLOCKED', failure_reason=os.environ['MATRIX_FAILURE_REASON'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
            printf '%s\n' "$output"
            exit $rc
          fi
          printf '%s\n' "$output"

      - name: Install Playwright Chromium
        run: python3 -m playwright install --with-deps chromium

      - name: Run static acceptance tests
        run: |
          set +e
          output=$(python3 -m pytest tests/test_workcell_web3d_visual_acceptance.py tests/test_workcell_studio_web_viewer_static.py -q 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            MATRIX_FAILURE_REASON="Run static acceptance tests failed: $output" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('build/web3d_supported_scenes_matrix.json')
          report = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          report.update(status='BLOCKED', failure_reason=os.environ['MATRIX_FAILURE_REASON'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
            printf '%s\n' "$output"
            exit $rc
          fi
          printf '%s\n' "$output"

      - name: Run offline scene readiness matrix
        run: python3 scripts/run_workcell_studio_scene_readiness_matrix.py

      - name: Run supported-scenes Web 3D browser acceptance matrix sequentially
        run: |
          python3 scripts/run_workcell_web3d_visual_acceptance.py \
            --all-supported-scenes \
            --require-browser \
            --sequential \
            --output build/web3d_supported_scenes_matrix.json

      - name: Add Web 3D matrix artifact summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path('build/web3d_supported_scenes_matrix.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.is_file() else {}
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as fh:
              fh.write('## Web 3D supported-scenes Product View matrix\n\n')
              fh.write('| Field | Value |\n| --- | --- |\n')
              fh.write(f"| status | {report.get('status', 'missing')} |\n")
              fh.write(f"| counts | {report.get('counts', 'missing')} |\n")
              fh.write(f"| browser runtime method | Playwright Chromium required |\n")
              fh.write(f"| report artifact name | web3d_supported_scenes_matrix.json |\n")
              fh.write(f"| screenshot artifact name | workcell_studio_web_scene failure screenshots |\n")
              for row in report.get('scenes', []):
                  fh.write(f"| {row.get('scene_id')} | {row.get('status')} / {row.get('terminal_stage')} / {row.get('expected_robot')} + {row.get('expected_tool')} |\n")
          PY

      - name: Upload Web 3D visual acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supported-scenes-web3d-visual-acceptance
          if-no-files-found: warn
          path: |
            build/web3d_supported_scenes_matrix.json
            build/workcell_studio_web_scene/*.visual_acceptance.json
            build/workcell_studio_web_scene/*.browser_status.json
            build/workcell_studio_web_scene/*.web_scene.json
            build/workcell_studio_web_scene/*.png
