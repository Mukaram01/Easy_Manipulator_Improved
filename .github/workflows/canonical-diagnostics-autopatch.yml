              assert "robotPreviewLifecycleState" not in lifecycle

          def test_qt_status_parser_uses_one_documented_compatibility_boundary():
              source = QT.read_text(encoding="utf-8")
              start = source.index('static const char kStatusScript[]')
              end = source.index(')JS";', start)
              script = source[start:end]
              assert "External compatibility boundary" in script
              assert "const read = (snake, legacy)" in script
              assert "failed_required_item_count', 'failedRequiredItemCount'" in script
              assert "required_mesh_failed_count" not in script
              assert "s.pending_required_loads || s.pendingRequiredLoads" not in script
          ''', encoding='utf-8')

