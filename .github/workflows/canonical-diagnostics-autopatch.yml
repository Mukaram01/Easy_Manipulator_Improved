name: Canonical Diagnostics Autopatch

on:
  push:
    branches:
      - codex/canonical-snake-case-viewer-diagnostics

permissions:
  contents: write

concurrency:
  group: canonical-diagnostics-autopatch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-snake-case-viewer-diagnostics
          fetch-depth: 0

      - name: Recover and repair focused patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          workflow_path = '.github/workflows/canonical-diagnostics-autopatch.yml'
          previous = subprocess.check_output(
              ['git', 'show', f'HEAD^:{workflow_path}'], text=True
          )
          marker = "          cat > /tmp/apply_canonical_diagnostics.py <<'PY'\n"
          start = previous.index(marker) + len(marker)
          end = previous.index("\n          PY\n", start)
          script = textwrap.dedent(previous[start:end])

          block = re.compile(
              r"failed_start, failed_end, _, _ = function_span\(viewer, 'failedCanvasPickDiagnostic'\)\n"
              r"failed_fn = viewer\[failed_start:failed_end\]\n"
              r"return_pattern = re\.compile\([\s\S]*?"
              r"viewer = viewer\[:failed_start\] \+ failed_fn \+ viewer\[failed_end:\]\n"
          )
          replacement = '''failed_start, failed_end, _, _ = function_span(viewer, 'failedCanvasPickDiagnostic')
          failed_fn = viewer[failed_start:failed_end]
          return_start = failed_fn.rfind('\\n  return {')
          if return_start < 0:
              raise SystemExit('failedCanvasPickDiagnostic return payload start not found')
          return_end = failed_fn.find('\\n  };', return_start)
          if return_end < 0:
              raise SystemExit('failedCanvasPickDiagnostic return payload end not found')
          return_end += len('\\n  };')
          canonical_return = r'''\\n  return canonicalDiagnosticValue({
            raw_hit_count: (hits || []).length,
            hit_object_names: objectNames,
            traversed_registered_identity: traversedRegisteredIdentity,
            first_actionable_rejection_reason: firstActionableRejectionReason,
            nearest_known_urdf_link_ancestor: nearestKnownUrdfLinkAncestor,
            hit_resolutions: hitResolutions,
          });'''
          failed_fn = failed_fn[:return_start] + canonical_return + failed_fn[return_end:]
          viewer = viewer[:failed_start] + failed_fn + viewer[failed_end:]
          '''
          script, count = block.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit('could not repair failedCanvasPickDiagnostic patch block')
          Path('/tmp/apply_canonical_diagnostics.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_canonical_diagnostics.py

      - name: Run focused validation
        shell: bash
        run: |
          node --check workcell_studio_web/viewer/viewer.js
          node --check workcell_studio_web/viewer/urdf_robot_renderer.js
          python3 -m pytest -q \
            tests/test_workcell_web3d_diagnostic_naming_contract.py \
            tests/test_workcell_studio_web_viewer_static.py \
            tests/test_embedded_web3d_editor_bridge_static.py

      - name: Commit final focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workcell_studio_web/viewer/viewer.js
          git add workcell_studio_web/viewer/urdf_robot_renderer.js
          git add workcell_builder/workcell_builder/gui/scene_preview_widget.cpp
          git add tests/test_workcell_web3d_diagnostic_naming_contract.py
          git add -u .github/workflows/canonical-diagnostics-autopatch.yml
          git diff --cached --check
          git commit -m "Canonicalize Web3D diagnostics as snake case"
          git push origin HEAD:codex/canonical-snake-case-viewer-diagnostics
