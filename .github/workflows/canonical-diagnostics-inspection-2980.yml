name: Canonical diagnostics source inspection

on:
  push:
    branches:
      - automation/canonical-diagnostics-inspection-2980

permissions:
  contents: read

jobs:
  export-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect focused sources
        run: |
          set -euxo pipefail
          mkdir -p inspection/workcell_studio_web/viewer
          mkdir -p inspection/workcell_builder/workcell_builder/gui
          mkdir -p inspection/tests
          cp workcell_studio_web/viewer/viewer.js inspection/workcell_studio_web/viewer/
          cp workcell_studio_web/viewer/urdf_robot_renderer.js inspection/workcell_studio_web/viewer/
          cp workcell_builder/workcell_builder/gui/scene_preview_widget.cpp inspection/workcell_builder/workcell_builder/gui/
          cp tests/test_workcell_studio_web_viewer_static.py inspection/tests/
          cp tests/test_workcell_web3d_mesh_coordinate_space_contract.py inspection/tests/
          cp tests/test_embedded_web3d_status_sync.py inspection/tests/
          cp tests/test_workcell_builder_embedded_web3d_readiness_policy.py inspection/tests/
          find inspection -type f -maxdepth 8 -print
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-diagnostics-sources-2980
          path: inspection
          if-no-files-found: error
