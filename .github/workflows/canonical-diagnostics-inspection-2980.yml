name: Canonical diagnostics patch validation

on:
  push:
    branches:
      - automation/canonical-diagnostics-inspection-2980

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          npm ci --prefix workcell_studio_web/viewer

      - name: Reassemble focused patch
        run: |
          set -euxo pipefail
          cat .github/temporary/canonical-diagnostics-2980/chunk_* > /tmp/canonical.patch.gz.b64
          base64 --decode /tmp/canonical.patch.gz.b64 | gzip --decompress > /tmp/canonical.patch
          test "$(wc -c < /tmp/canonical.patch)" -gt 100000

      - name: Apply patch on clean main
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout -B codex/canonical-snake-case-viewer-diagnostics-clean origin/main
          git apply --index /tmp/canonical.patch
          git diff --cached --check

      - name: Enforce source-only scope
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "workcell_studio_web/viewer/viewer.js",
              "workcell_studio_web/viewer/urdf_robot_renderer.js",
              "workcell_builder/workcell_builder/gui/scene_preview_widget.cpp",
              "tests/test_workcell_studio_web_viewer_static.py",
              "tests/test_embedded_web3d_status_sync.py",
              "tests/test_workcell_web3d_diagnostic_naming_contract.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {unexpected}")
          if missing:
              raise SystemExit(f"Expected changed files missing: {missing}")
          forbidden = [
              path for path in changed
              if "/dist/" in path or path.startswith(".github/")
          ]
          if forbidden:
              raise SystemExit(f"Forbidden generated/workflow files: {forbidden}")
          print("Validated changed files:")
          for path in sorted(changed):
              print(path)
          PY

      - name: JavaScript syntax checks
        run: |
          set -euxo pipefail
          node --check workcell_studio_web/viewer/viewer.js
          node --check workcell_studio_web/viewer/urdf_robot_renderer.js

      - name: Focused diagnostic tests
        id: focused_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_workcell_web3d_diagnostic_naming_contract.py \
            tests/test_workcell_web3d_mesh_coordinate_space_contract.py \
            tests/test_workcell_studio_web_viewer_static.py \
            tests/test_embedded_web3d_status_sync.py \
            tests/test_workcell_builder_embedded_web3d_readiness_policy.py \
            2>&1 | tee /tmp/focused-diagnostic-tests.txt

      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-diagnostics-focused-test-output
          path: /tmp/focused-diagnostic-tests.txt
          if-no-files-found: error

      - name: Require focused tests
        if: steps.focused_tests.outcome != 'success'
        run: |
          cat /tmp/focused-diagnostic-tests.txt
          exit 1

      - name: Commit and push final branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalize Web3D diagnostic field names"
          git push --force-with-lease origin HEAD:codex/canonical-snake-case-viewer-diagnostics-clean
          git rev-parse HEAD
