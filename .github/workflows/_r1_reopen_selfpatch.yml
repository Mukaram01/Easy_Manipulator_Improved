name: R1 Product View reopen self-patch

on:
  push:
    branches:
      - fix/ur5-2f-product-view-reopen-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ur5-2f-product-view-reopen-lifecycle
          fetch-depth: 0
      - name: Apply focused source patch
        run: python3 tools/_r1_reopen_selfpatch.py
      - name: Run focused regression tests
        run: python3 -m pytest -q tests/test_product_view_reopen_lifecycle.py tests/test_scene_preview_widget_lifecycle_cancellation.py
      - name: Commit product fix and remove one-shot machinery
        run: |
          rm -f tools/_r1_reopen_selfpatch.py .github/workflows/_r1_reopen_selfpatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Product View reopen server and async lifecycle"
          git push origin HEAD:fix/ur5-2f-product-view-reopen-lifecycle
