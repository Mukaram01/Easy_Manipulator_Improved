name: Temporary canonical diagnostics patch inspection v5

on:
  push:
    branches:
      - automation/canonical-diagnostics-recovery-v3

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/canonical-diagnostics-recovery-v3
          fetch-depth: 0

      - name: Recover and inspect partial patch
        shell: bash
        run: |
          set -u
          REPORT=partial-patch-report.txt
          PATCH=partial-canonical-diagnostics.patch
          : > "$REPORT"

          echo "== chunk inventory ==" >> "$REPORT"
          ls -l .github/temporary/canonical-diagnostics-2980/chunk_* >> "$REPORT" 2>&1
          wc -c .github/temporary/canonical-diagnostics-2980/chunk_* >> "$REPORT" 2>&1
          echo >> "$REPORT"

          cat .github/temporary/canonical-diagnostics-2980/chunk_* | base64 -d > /tmp/canonical-diagnostics.gz 2>> "$REPORT"
          echo "compressed_bytes=$(wc -c < /tmp/canonical-diagnostics.gz)" >> "$REPORT"
          gzip -dc /tmp/canonical-diagnostics.gz > "$PATCH" 2>> "$REPORT" || true
          echo "patch_bytes=$(wc -c < "$PATCH")" >> "$REPORT"
          echo "patch_lines=$(wc -l < "$PATCH")" >> "$REPORT"

          echo >> "$REPORT"
          echo "== diff headers ==" >> "$REPORT"
          grep -n '^diff --git ' "$PATCH" >> "$REPORT" || true
          echo >> "$REPORT"
          echo "== hunk headers ==" >> "$REPORT"
          grep -n '^@@ ' "$PATCH" >> "$REPORT" || true
          echo >> "$REPORT"
          echo "== patch tail ==" >> "$REPORT"
          tail -n 160 "$PATCH" >> "$REPORT" || true

          echo >> "$REPORT"
          echo "== apply check against cleanup commit ==" >> "$REPORT"
          git fetch origin chore/remove-temporary-diagnostics-artifacts >> "$REPORT" 2>&1
          rm -rf /tmp/recovery-check
          git worktree add --detach /tmp/recovery-check 43acccb6470a9de6fdf69a6b6ce68d18368b1898 >> "$REPORT" 2>&1
          (
            cd /tmp/recovery-check
            git apply --check --verbose "$GITHUB_WORKSPACE/$PATCH"
          ) >> "$REPORT" 2>&1 || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT" "$PATCH"
          git commit -m "[recovery-output] Capture partial canonical diagnostics patch"
          git push origin HEAD:automation/canonical-diagnostics-recovery-v3
