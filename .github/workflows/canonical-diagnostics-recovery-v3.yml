name: Temporary canonical diagnostics source builder v12

on:
  push:
    branches:
      - automation/canonical-snake-case-viewer-diagnostics-v10

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/canonical-snake-case-viewer-diagnostics-v10
          fetch-depth: 0

      - name: Build, validate, and publish direct source patch
        shell: bash
        run: |
          set -u
          ROOT="$PWD"
          WORKTREE=/tmp/canonical-diagnostics-v12
          LOG="$ROOT/recovery-v12.log"
          DIFF="$ROOT/recovery-v12.diff"
          SOURCE_BRANCH=codex/canonical-snake-case-viewer-diagnostics-clean-v3
          STATUS=0
          SOURCE_SHA=""
          : > "$LOG"
          : > "$DIFF"

          git fetch origin chore/remove-temporary-diagnostics-artifacts >> "$LOG" 2>&1 || STATUS=1
          rm -rf "$WORKTREE"
          if [ "$STATUS" -eq 0 ]; then
            git worktree add --detach "$WORKTREE" 43acccb6470a9de6fdf69a6b6ce68d18368b1898 >> "$LOG" 2>&1 || STATUS=1
          fi

          if [ "$STATUS" -eq 0 ]; then
            cd "$WORKTREE"
            python3 - <<'PY' >> "$LOG" 2>&1 || STATUS=1
          from pathlib import Path
          import re

          VIEWER = Path("workcell_studio_web/viewer/viewer.js")
          RENDERER = Path("workcell_studio_web/viewer/urdf_robot_renderer.js")
          QT = Path("workcell_builder/workcell_builder/gui/scene_preview_widget.cpp")
          STATIC_TEST = Path("tests/test_workcell_studio_web_viewer_static.py")
          CONTRACT_TEST = Path("tests/test_workcell_web3d_diagnostic_naming_contract.py")


          def snake_case(name: str) -> str:
              value = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1_\2", name)
              value = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", value)
              return value.replace("-", "_").lower()


          def matching(text: str, start: int, opening: str, closing: str) -> int:
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              index = start
              while index < len(text):
                  char = text[index]
                  following = text[index + 1] if index + 1 < len(text) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if char == "*" and following == "/":
                          block_comment = False
                          index += 2
                      else:
                          index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == "/" and following == "/":
                      line_comment = True
                      index += 2
                      continue
                  if char == "/" and following == "*":
                      block_comment = True
                      index += 2
                      continue
                  if char in ("'", '"', "`"):
                      quote = char
                      index += 1
                      continue
                  if char == opening:
                      depth += 1
                  elif char == closing:
                      depth -= 1
                      if depth == 0:
                          return index
                  index += 1
              raise RuntimeError(f"unterminated {opening}{closing} block")


          def function_span(text: str, name: str) -> tuple[int, int]:
              match = re.search(rf"\bfunction\s+{re.escape(name)}\s*\(", text)
              if not match:
                  raise RuntimeError(f"function not found: {name}")
              paren = text.index("(", match.start())
              paren_end = matching(text, paren, "(", ")")
              brace = text.index("{", paren_end)
              brace_end = matching(text, brace, "{", "}")
              return match.start(), brace_end + 1


          def function_block(text: str, name: str) -> str:
              start, end = function_span(text, name)
              return text[start:end]


          def replace_function(text: str, name: str, block: str) -> str:
              start, end = function_span(text, name)
              return text[:start] + block + text[end:]


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          def canonicalize_property_lines(block: str) -> str:
              lines = block.splitlines(keepends=True)
              prop = re.compile(r"^(\s+)([A-Za-z_$][A-Za-z0-9_$]*)(\s*:\s*.*|\s*,\s*)(\r?\n)?$")
              canonical_present = set()
              for line in lines:
                  match = prop.match(line)
                  if match:
                      canonical_present.add(match.group(2))
              output = []
              for line in lines:
                  match = prop.match(line)
                  if not match:
                      output.append(line)
                      continue
                  indent, key, suffix, newline = match.groups()
                  if not re.search(r"[A-Z]", key):
                      output.append(line)
                      continue
                  canonical = snake_case(key)
                  if canonical in canonical_present:
                      continue
                  canonical_present.add(canonical)
                  if suffix.lstrip().startswith(":"):
                      output.append(f"{indent}{canonical}{suffix}{newline or ''}")
                  else:
                      output.append(f"{indent}{canonical}: {key},{newline or ''}")
              return "".join(output)


          def wrap_object_after_marker(block: str, marker: str) -> str:
              start = block.find(marker)
              if start < 0:
                  raise RuntimeError(f"object marker missing: {marker}")
              brace = block.index("{", start)
              end = matching(block, brace, "{", "}")
              prefix = block[:start] + marker.replace("{", "canonicalDiagnosticValue({", 1)
              return prefix + block[brace + 1:end] + ")" + block[end:]


          def wrap_return_objects(block: str) -> str:
              starts = [match.start() for match in re.finditer(r"\breturn\s*\{", block)]
              for start in reversed(starts):
                  brace = block.index("{", start)
                  end = matching(block, brace, "{", "}")
                  block = block[:brace] + "canonicalDiagnosticValue({" + block[brace + 1:end] + "})" + block[end + 1:]
              return block


          def wrap_final_identifier_return(block: str) -> str:
              close = block.rfind("}")
              before = block[:close]
              matches = list(re.finditer(r"\breturn\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*;", before))
              if not matches:
                  return block
              match = matches[-1]
              identifier = match.group(1)
              replacement = f"return canonicalDiagnosticValue({identifier});"
              return block[:match.start()] + replacement + block[match.end():]


          viewer = VIEWER.read_text()
          anchor = "const WEB3D_REQUIRED_CATEGORIES = ['robot_arm', 'attached_tool_gripper', 'workbench_support_surface', 'configured_camera'];\n"
          helper = r'''
          // Diagnostic payload contract: emitted/status/readiness objects use
          // canonical snake_case. Legacy camelCase reads are restricted to the
          // documented Qt status-script compatibility boundary.
          const DIAGNOSTIC_NAMING_CONTRACT = Object.freeze({
            canonical_case: 'snake_case',
            compatibility_boundary: 'qt_status_script',
          });
          function diagnosticSnakeCaseKey(key) {
            return String(key || '')
              .replace(/([A-Z]+)([A-Z][a-z])/g, '$1_$2')
              .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
              .replace(/-/g, '_')
              .toLowerCase();
          }
          function canonicalDiagnosticValue(value) {
            if (Array.isArray(value)) return value.map(canonicalDiagnosticValue);
            if (!value || typeof value !== 'object') return value;
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) return value;
            const output = {};
            const entries = Object.entries(value).sort(([left], [right]) =>
              Number(left !== diagnosticSnakeCaseKey(left)) - Number(right !== diagnosticSnakeCaseKey(right)));
            for (const [key, item] of entries) {
              const canonicalKey = diagnosticSnakeCaseKey(key);
              if (Object.prototype.hasOwnProperty.call(output, canonicalKey)) continue;
              output[canonicalKey] = canonicalDiagnosticValue(item);
            }
            return output;
          }
          function stableDiagnosticValue(value) {
            const canonical = canonicalDiagnosticValue(value);
            if (Array.isArray(canonical)) return canonical.map(stableDiagnosticValue);
            if (!canonical || typeof canonical !== 'object') return canonical;
            return Object.fromEntries(Object.keys(canonical).sort().map(key => [key, stableDiagnosticValue(canonical[key])]));
          }
          function stableDiagnosticSignature(kind, payload) {
            return `${String(kind || 'diagnostic')}\n${JSON.stringify(stableDiagnosticValue(payload))}`;
          }
          function recordNormalDiagnosticOnce(kind, payload) {
            const diagnostic = canonicalDiagnosticValue(payload);
            const signature = stableDiagnosticSignature(kind, diagnostic);
            state.normalDiagnosticRecords = state.normalDiagnosticRecords || new Map();
            if (state.normalDiagnosticRecords.has(signature)) {
              return { diagnostic: state.normalDiagnosticRecords.get(signature), is_new: false, signature };
            }
            state.normalDiagnosticRecords.set(signature, diagnostic);
            state.diagnosticKeys.add(signature);
            return { diagnostic, is_new: true, signature };
          }
          function warnNormalDiagnosticOnce(kind, payload, message) {
            const recorded = recordNormalDiagnosticOnce(kind, payload);
            if (recorded.is_new) console.warn?.(`${message}: ${JSON.stringify(recorded.diagnostic)}`);
            return recorded.diagnostic;
          }
          '''.strip() + "\n"
          viewer = replace_once(viewer, anchor, anchor + helper, "viewer helper anchor")

          # Preserve the existing readiness calculations while deleting the explicit
          # duplicate camelCase aliases from the structured payload.
          block = function_block(viewer, "structuredWeb3dReadinessFields")
          for alias_line in (
              "    readinessContractVersion,\n",
              "    sceneId: sceneIdentity,\n",
              "    navigationKey,\n",
              "    loadAttemptId,\n",
              "    lifecycleState: normalizedLifecycleState,\n",
              "    previousLifecycleState: normalizedPreviousLifecycleState,\n",
              "    statusSequence,\n",
              "    requiredItemCount,\n",
              "    requiredItemFailedCount,\n",
              "    requiredMeshFailedCount,\n",
              "    expectedPhysicalItemCount,\n",
              "    renderedPhysicalItemCount,\n",
              "    expectedRobotVisualCount,\n",
              "    renderedRobotVisualCount,\n",
              "    failedRobotVisualCount,\n",
              "    missingRobotVisualCount: missingRobotVisualCount,\n",
          ):
              if alias_line in block:
                  block = block.replace(alias_line, "", 1)
          block = wrap_return_objects(block)
          viewer = replace_function(viewer, "structuredWeb3dReadinessFields", block)

          block = function_block(viewer, "emitWeb3dReadinessState")
          opening = block.index("{") + 1
          block = block[:opening] + "\n  detail = canonicalDiagnosticValue(detail);" + block[opening:]
          event_marker = "const eventDetail = {"
          if event_marker in block:
              block = wrap_object_after_marker(block, event_marker)
          message_marker = "const readinessMessage = {"
          if message_marker in block:
              block = wrap_object_after_marker(block, message_marker)
          block = canonicalize_property_lines(block)
          viewer = replace_function(viewer, "emitWeb3dReadinessState", block)

          for name in (
              "failedCanvasPickDiagnostic",
              "collectRenderedMeshDiagnostics",
              "collectAssemblyRenderDiagnostics",
              "expandedUrdfVisualReadinessDiagnostics",
          ):
              block = canonicalize_property_lines(function_block(viewer, name))
              block = wrap_return_objects(block)
              block = wrap_final_identifier_return(block)
              viewer = replace_function(viewer, name, block)

          for name in ("updateViewerStatus", "showError"):
              block = canonicalize_property_lines(function_block(viewer, name))
              marker = "window.__WORKCELL_VIEWER_STATUS__ = {"
              if marker in block:
                  block = wrap_object_after_marker(block, marker)
              block = wrap_final_identifier_return(block)
              viewer = replace_function(viewer, name, block)

          # Canonicalize the rejected-pick record and suppress repeated warnings for
          # the same stable payload signature.
          signature_start = viewer.index("      const signature = ['failed_canvas_pick'")
          signature_if = viewer.index("      if (!state.diagnosticKeys.has(signature)) {", signature_start)
          signature_brace = viewer.index("{", signature_if)
          signature_end = matching(viewer, signature_brace, "{", "}") + 1
          viewer = viewer[:signature_start] + "      warnNormalDiagnosticOnce('failed_canvas_pick', { scene_id: sceneId(), ...diagnostic }, 'Product View canvas pick rejected');" + viewer[signature_end:]

          # Remove the one redundant alternate snake_case assembly alias and known
          # explicit renderer-lifecycle camel aliases outside the focused producers.
          viewer = re.sub(r"^\s*detached_robot_mesh_clusters_count:.*\n", "", viewer, flags=re.MULTILINE)
          for alias in ("robotPreviewLifecycleState", "robotPreviewFailureReason"):
              viewer = re.sub(
                  rf"^\s*state\.robotPreviewDiagnostics\.{alias}\s*=.*\n",
                  "",
                  viewer,
                  flags=re.MULTILINE,
              )
          VIEWER.write_text(viewer)

          renderer = RENDERER.read_text()
          renderer_anchor = "const ROBOT_RENDER_MODE = 'expanded_urdf_loader';\n"
          renderer_helper = r'''

          function diagnosticSnakeCaseKey(key) {
            return String(key || '')
              .replace(/([A-Z]+)([A-Z][a-z])/g, '$1_$2')
              .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
              .replace(/-/g, '_')
              .toLowerCase();
          }
          function canonicalDiagnosticValue(value) {
            if (Array.isArray(value)) return value.map(canonicalDiagnosticValue);
            if (!value || typeof value !== 'object') return value;
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) return value;
            const output = {};
            const entries = Object.entries(value).sort(([left], [right]) =>
              Number(left !== diagnosticSnakeCaseKey(left)) - Number(right !== diagnosticSnakeCaseKey(right)));
            for (const [key, item] of entries) {
              const canonicalKey = diagnosticSnakeCaseKey(key);
              if (Object.prototype.hasOwnProperty.call(output, canonicalKey)) continue;
              output[canonicalKey] = canonicalDiagnosticValue(item);
            }
            return output;
          }
          '''
          renderer = replace_once(renderer, renderer_anchor, renderer_anchor + renderer_helper, "renderer helper anchor")
          renderer = renderer.replace(
              "diagnostics.robot_package_mesh_rejections.push({ source_url: sourceUrl || '', sourceUrl: sourceUrl || '', policy_reason: reason, policyReason: reason });",
              "diagnostics.robot_package_mesh_rejections.push({ source_url: sourceUrl || '', policy_reason: reason });",
          )
          renderer = renderer.replace(
              "{ path, source_url: path, sourceUrl: path, policy_reason: reason, policyReason: reason, ...inferMeshLinkDetail(path) }",
              "{ path, source_url: path, policy_reason: reason, ...inferMeshLinkDetail(path) }",
          )
          renderer = renderer.replace(
              "{ url, uri, path, source_url: path, sourceUrl: path, policy_reason: err?.message || 'loader failure', policyReason: err?.message || 'loader failure', ...inferMeshLinkDetail(path) }",
              "{ url, uri, path, source_url: path, policy_reason: err?.message || 'loader failure', ...inferMeshLinkDetail(path) }",
          )

          diagnostic_aliases = {
              "colladaZUpConsoleMessageCount",
              "robotPreviewLifecycleState",
              "robotPreviewFailureReason",
              "robotColladaRootNormalizationCount",
              "robotExpectedVisualCount",
              "robotFailedVisualCount",
              "robotCompletedVisualCount",
              "robotLoadingManagerComplete",
              "robotMatrixWorldParity",
              "robotLinkWorldMatrices",
              "robotVisualWrapperWorldMatrices",
              "robotVisualMeshWorldBounds",
              "robotDescendantRenderMeshDiagnostics",
              "robotRootLinkCount",
              "robotRootLinks",
              "robotDisconnectedLinks",
              "robotDuplicateLinks",
              "robotPreviewCanonicalFallbackUsed",
              "robotColladaMeshDiagnostics",
              "robotColladaSummary",
              "robotMissingRequiredRobotVisualLinks",
              "robotMissingRequiredToolVisualLinks",
              "robotExpectedRobotVisualLinks",
              "robotExpectedToolVisualLinks",
              "robotMeshCallbacksComplete",
              "robotBaseAnchorPrePosition",
              "robotBaseAnchorPostPosition",
              "robotBaseAnchorExpectedPosition",
              "robotBaseAnchorWorldPosition",
              "robotAnchorDeltaPosition",
          }
          for alias in diagnostic_aliases:
              renderer = re.sub(
                  rf"^\s*(?:result\.)?diagnostics\.{re.escape(alias)}\s*=.*\n",
                  "",
                  renderer,
                  flags=re.MULTILINE,
              )
              renderer = re.sub(
                  rf"^\s*{re.escape(alias)}\s*:\s*.*\n",
                  "",
                  renderer,
                  flags=re.MULTILINE,
              )

          nested_aliases = {
              "linkName", "visualIndex", "meshIndex", "objectName", "parentName",
              "matrixWorld", "worldPosition", "worldQuaternion", "worldScale",
              "boundsCenter", "boundsSize", "boundsValid", "maxAbsDelta",
              "expectedMatrixWorld", "actualMatrixWorld", "comparedCount",
          }
          for alias in nested_aliases:
              renderer = re.sub(rf"^\s*{re.escape(alias)},\s*\n", "", renderer, flags=re.MULTILINE)
              renderer = re.sub(rf"^\s*{re.escape(alias)}\s*:\s*.*\n", "", renderer, flags=re.MULTILINE)

          renderer = renderer.replace(
              "  collectMatrixParityDiagnostics(result?.previewConfig || {}, result.diagnostics);\n  return result.diagnostics;",
              "  collectMatrixParityDiagnostics(result?.previewConfig || {}, result.diagnostics);\n  result.diagnostics = canonicalDiagnosticValue(result.diagnostics);\n  return result.diagnostics;",
          )
          renderer = renderer.replace(
              "    rendererContext?.onRobotLoaded?.(result);",
              "    result.diagnostics = canonicalDiagnosticValue(result.diagnostics);\n    rendererContext?.onRobotLoaded?.(result);",
          )
          renderer = renderer.replace(
              "    rendererContext?.onRobotError?.(err, diagnostics);",
              "    result.diagnostics = canonicalDiagnosticValue(diagnostics);\n    rendererContext?.onRobotError?.(err, result.diagnostics);",
          )
          RENDERER.write_text(renderer)

          qt = QT.read_text()
          script_start = qt.index('  static const char kStatusScript[] = R"JS(')
          script_end = qt.index(')JS";', script_start) + len(')JS";')
          status_script = r'''  static const char kStatusScript[] = R"JS(
          (() => {
            const s = window.__WORKCELL_VIEWER_STATUS__ || {};
            // External compatibility boundary: canonical snake_case first, with
            // exactly one narrowly scoped legacy camelCase fallback per field.
            const readStatus = (canonicalKey, legacyKey, fallbackValue) => {
              const canonicalValue = s[canonicalKey];
              if (canonicalValue !== undefined && canonicalValue !== null) return canonicalValue;
              const legacyValue = s[legacyKey];
              return legacyValue !== undefined && legacyValue !== null ? legacyValue : fallbackValue;
            };
            const lifecycleState = String(readStatus('lifecycle_state', 'lifecycleState', ''));
            const pendingLoads = readStatus('pending_required_loads', 'pendingRequiredLoads', []);
            return {
              readiness_contract_version: Number(readStatus('readiness_contract_version', 'readinessContractVersion', 0)),
              lifecycle_state: lifecycleState,
              terminal: Boolean(s.terminal),
              status_sequence: Number(readStatus('status_sequence', 'statusSequence', 0)),
              builder_revision: String(readStatus('builder_revision', 'builderRevision', '')),
              web3d_readiness_state: String(readStatus('web3d_readiness_state', 'web3dReadinessState', lifecycleState)),
              viewer_boot_state: String(readStatus('viewer_boot_state', 'viewerBootState', '')),
              scene_name: String(readStatus('scene_name', 'sceneName', '')),
              source_web_scene_file: String(readStatus('source_web_scene_file', 'sourceWebSceneFile', '')),
              scene_json_loaded: Boolean(readStatus('scene_json_loaded', 'sceneJsonLoaded', false)),
              robot_preview_lifecycle_state: String(readStatus('robot_preview_lifecycle_state', 'robotPreviewLifecycleState', '')),
              scene_id: String(readStatus('scene_id', 'sceneId', '')),
              failed_required_item_count: Number(readStatus('failed_required_item_count', 'failedRequiredItemCount', 0)),
              required_mesh_failed_count: Number(readStatus('required_mesh_failed_count', 'requiredMeshFailedCount', 0)),
              expected_physical_item_count: Number(readStatus('expected_physical_item_count', 'expectedPhysicalItemCount', 0)),
              rendered_physical_item_count: Number(readStatus('rendered_physical_item_count', 'renderedPhysicalItemCount', 0)),
              expected_robot_visual_count: Number(readStatus('expected_robot_visual_count', 'expectedRobotVisualCount', 0)),
              rendered_robot_visual_count: Number(readStatus('rendered_robot_visual_count', 'renderedRobotVisualCount', 0)),
              failed_robot_visual_count: Number(readStatus('failed_robot_visual_count', 'failedRobotVisualCount', 0)),
              expected_robot_link_count: Number(readStatus('expected_robot_link_count', 'expectedRobotLinkCount', 0)),
              rendered_robot_link_count: Number(readStatus('rendered_robot_link_count', 'renderedRobotLinkCount', 0)),
              missing_robot_link_count: Number(readStatus('missing_robot_link_count', 'missingRobotLinkCount', 0)),
              robot_status: String(readStatus('robot_status', 'robotStatus', '')),
              tool_status: String(readStatus('tool_status', 'toolStatus', '')),
              environment_status: String(readStatus('environment_status', 'environmentStatus', '')),
              camera_status: String(readStatus('camera_status', 'cameraStatus', '')),
              pending_required_loads: Array.isArray(pendingLoads) ? pendingLoads : [],
              final_lifecycle_state: String(readStatus('final_lifecycle_state', 'finalLifecycleState', lifecycleState)),
              readiness_failure: readStatus('readiness_failure', 'readinessFailure', null),
              readiness_failure_code: String(readStatus('readiness_failure_code', 'readinessFailureCode', '')),
              readiness_failure_reason: String(readStatus('readiness_failure_reason', 'readinessFailureReason', '')),
              failed_stage: String(readStatus('failed_stage', 'failedStage', '')),
              fatal_error: String(readStatus('fatal_error', 'fatalError', '')),
              fatal_stack: String(readStatus('fatal_stack', 'fatalStack', '')).split('\n').slice(0, 6).join('\n')
            };
          })()
          )JS";'''
          qt = qt[:script_start] + status_script + qt[script_end:]
          QT.write_text(qt)

          tests = STATIC_TEST.read_text()
          tests = tests.replace(
              "editorState().lastFailedCanvasPickDiagnostic.rawHitCount",
              "editorState().lastFailedCanvasPickDiagnostic.raw_hit_count",
          )
          tests = tests.replace(
              "window.__WORKCELL_VIEWER_STATUS__.meshLoadedCount",
              "window.__WORKCELL_VIEWER_STATUS__.mesh_loaded_count",
          )
          tests = tests.replace(
              "window.__WORKCELL_VIEWER_STATUS__.requiredMeshFailedCount",
              "window.__WORKCELL_VIEWER_STATUS__.required_mesh_failed_count",
          )
          tests = tests.replace("status.web3dReadinessState", "status.web3d_readiness_state")
          tests = tests.replace(
              'assert "requiredMeshFailedCount: statusCountedRenderables().filter(isRequiredMeshFailureStatus).length" in status_body',
              'assert "required_mesh_failed_count: statusCountedRenderables().filter(isRequiredMeshFailureStatus).length" in status_body',
          )
          tests = tests.replace(
              'assert "const eventDetail = { ...structured, ...detail, final_lifecycle_state: readinessState" in viewer',
              'assert "const eventDetail = canonicalDiagnosticValue({" in viewer\n    assert "final_lifecycle_state: readinessState" in viewer',
          )
          tests = re.sub(r"^\s*robotColladaRootNormalizationCount:\s*0,\s*\n", "", tests, flags=re.MULTILINE)
          tests = re.sub(r"^\s*assert\.equal\(diagnostics\.robotColladaRootNormalizationCount,\s*1\);\s*\n", "", tests, flags=re.MULTILINE)
          STATIC_TEST.write_text(tests)

          contract_test = r'''from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          VIEWER = (ROOT / "workcell_studio_web/viewer/viewer.js").read_text()
          RENDERER = (ROOT / "workcell_studio_web/viewer/urdf_robot_renderer.js").read_text()
          QT = (ROOT / "workcell_builder/workcell_builder/gui/scene_preview_widget.cpp").read_text()


          def function_source(source: str, name: str) -> str:
              start = source.index(f"function {name}(")
              next_function = source.find("\nfunction ", start + 1)
              return source[start:] if next_function < 0 else source[start:next_function]


          def declared_keys(source: str) -> list[str]:
              return re.findall(r"^\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*[:,]", source, re.MULTILINE)


          def test_viewer_declares_canonical_diagnostic_contract():
              assert "const DIAGNOSTIC_NAMING_CONTRACT" in VIEWER
              assert "canonical_case: 'snake_case'" in VIEWER
              assert "compatibility_boundary: 'qt_status_script'" in VIEWER
              assert "function canonicalDiagnosticValue(value)" in VIEWER


          def test_readiness_payload_has_no_duplicate_camel_aliases():
              source = function_source(VIEWER, "structuredWeb3dReadinessFields")
              keys = declared_keys(source)
              assert keys
              assert not [key for key in keys if re.search(r"[A-Z]", key)]
              assert "canonicalDiagnosticValue({" in source
              emit = function_source(VIEWER, "emitWeb3dReadinessState")
              assert "detail = canonicalDiagnosticValue(detail);" in emit
              assert "const eventDetail = canonicalDiagnosticValue({" in emit


          def test_failed_canvas_pick_has_one_canonical_copy_per_field():
