name: Temporary canonical diagnostics validation v11

on:
  push:
    branches:
      - automation/canonical-snake-case-viewer-diagnostics-v10

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/canonical-snake-case-viewer-diagnostics-v10
          fetch-depth: 0

      - name: Apply and validate recovered source patch
        shell: bash
        run: |
          set -u
          ROOT="$PWD"
          WORKTREE=/tmp/canonical-diagnostics-v11
          LOG="$ROOT/recovery-v11.log"
          STATUS=0
          : > "$LOG"

          git fetch origin chore/remove-temporary-diagnostics-artifacts >> "$LOG" 2>&1 || STATUS=1
          rm -rf "$WORKTREE"
          if [ "$STATUS" -eq 0 ]; then
            git worktree add --detach "$WORKTREE" 43acccb6470a9de6fdf69a6b6ce68d18368b1898 >> "$LOG" 2>&1 || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            cd "$WORKTREE"
            git apply --check --verbose "$ROOT/recovery-v10.diff" >> "$LOG" 2>&1 || STATUS=1
            [ "$STATUS" -ne 0 ] || git apply --whitespace=fix "$ROOT/recovery-v10.diff" >> "$LOG" 2>&1 || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "== scope ==" >> "$LOG"
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u >> "$LOG"
            node --check workcell_studio_web/viewer/viewer.js >> "$LOG" 2>&1 || STATUS=1
            node --check workcell_studio_web/viewer/urdf_robot_renderer.js >> "$LOG" 2>&1 || STATUS=1
            git diff --check >> "$LOG" 2>&1 || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "== install viewer dependencies ==" >> "$LOG"
            npm --prefix workcell_studio_web/viewer ci >> "$LOG" 2>&1 || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            python3 -m pip install --user --disable-pip-version-check pytest >> "$LOG" 2>&1 || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "== focused tests ==" >> "$LOG"
            python3 -m pytest -q \
              tests/test_workcell_web3d_diagnostic_naming_contract.py \
              tests/test_workcell_studio_web_viewer_static.py \
              >> "$LOG" 2>&1 || STATUS=1
          fi
          cd "$ROOT"
          echo "status=$STATUS" >> "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-v11.log
          git commit -m "[recovery-output] Capture canonical diagnostics v11 validation"
          git push origin HEAD:automation/canonical-snake-case-viewer-diagnostics-v10
          exit "$STATUS"
