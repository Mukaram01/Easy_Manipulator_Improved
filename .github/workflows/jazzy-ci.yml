name: Jazzy CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell scripts and embedded Python
        run: |
          bash -n fix_and_build_humble.sh scripts/fix_workspace_layout.sh
          python3 scripts/check_python_heredocs.py fix_and_build_humble.sh scripts/fix_workspace_layout.sh
          ./scripts/check_disallowed_artifact_names.sh

      - name: Validate dependency manifests
        run: |
          ruby - <<'RUBY'
          require 'yaml'

          manifest = 'dependencies/emd_epd_ws.repos'
          data = YAML.load_file(manifest)
          repos = data.is_a?(Hash) ? data['repositories'] : nil

          abort("#{manifest} must contain a top-level 'repositories' mapping") unless repos.is_a?(Hash)
          abort("#{manifest} has no repository entries") if repos.empty?

          required_fields = %w[type url]
          missing = {}

          repos.each do |name, info|
            unless info.is_a?(Hash)
              missing[name] = required_fields
              next
            end

            absent = required_fields.select do |field|
              value = info[field]
              value.nil? || value.to_s.strip.empty?
            end
            missing[name] = absent unless absent.empty?
          end

          unless missing.empty?
            missing.each { |repo, fields| warn("#{repo}: missing required fields #{fields.join(', ')}") }
            abort('Dependency manifest validation failed')
          end

          puts "Validated #{repos.length} dependency entries in #{manifest}"
          RUBY

  jazzy-ci:
    needs: security-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@2b7b7e10fd30ff131dfb33248ddd71c5ba31dd30 # v0.7
        with:
          required-ros-distributions: jazzy

      - name: Set up Node.js 20 (Web3D bundle freshness target)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The workspace lives outside the checkout so the source symlink cannot
      # recurse into it. Never put COLCON_IGNORE/AMENT_IGNORE in the workspace
      # root: colcon then discovers nothing and every later step passes empty.
      - name: Create workspace
        run: |
          mkdir -p "${{ runner.temp }}/ws/src"
          ln -s "${GITHUB_WORKSPACE}" "${{ runner.temp }}/ws/src/easy_manipulation_deployment"

      - name: Cache rosdep database
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.ros/rosdep
          key: rosdep-jazzy-${{ hashFiles('**/package.xml') }}
          restore-keys: |
            rosdep-jazzy-

      - name: Cache colcon build artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ${{ runner.temp }}/ws/build
            ${{ runner.temp }}/ws/install
          key: colcon-jazzy-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '**/setup.py') }}
          restore-keys: |
            colcon-jazzy-

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/ws
        run: |
          ./src/easy_manipulation_deployment/scripts/ensure_rosdep_overrides.sh
          rosdep update
          rosdep install --from-paths src --ignore-src -yr --rosdistro jazzy

      - name: Build
        working-directory: ${{ runner.temp }}/ws
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mapfile -t emd < <(colcon list --base-paths src/easy_manipulation_deployment --names-only)
          echo "easy_manipulation_deployment packages discovered: ${#emd[@]}"
          if [[ ${#emd[@]} -eq 0 ]]; then echo "::error::colcon discovered no repository packages"; exit 1; fi
          printf '%s\n' "${emd[@]}" > emd_packages.txt
          # Imported dependencies first, without their own test targets.
          colcon build --base-paths src --symlink-install \
            --packages-skip "${emd[@]}" \
            --cmake-args -DBUILD_TESTING=OFF
          colcon build --base-paths src --symlink-install --packages-select "${emd[@]}"
          for pkg in "${emd[@]}"; do
            [[ -d "install/$pkg" ]] || { echo "::error::$pkg was not built"; exit 1; }
          done

      - name: Test
        working-directory: ${{ runner.temp }}/ws
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mapfile -t emd < emd_packages.txt
          colcon test --base-paths src --packages-select "${emd[@]}"

      - name: Test results
        working-directory: ${{ runner.temp }}/ws
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose
          summary="$(colcon test-result | tail -n 1)"
          echo "$summary"
          tests="$(sed -n 's/^Summary: \([0-9]*\) tests.*/\1/p' <<<"$summary")"
          if [[ -z "$tests" || "$tests" -eq 0 ]]; then echo "::error::no test results were produced"; exit 1; fi
