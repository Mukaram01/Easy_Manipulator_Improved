name: Apply live Scene Builder CRUD fix

on:
  push:
    branches:
      - fix/scene-builder-live-authoring-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scene-builder-live-authoring-polish
          fetch-depth: 0

      - name: Apply incremental live-authoring patch
        run: python3 scripts/_apply_scene_builder_polish.py

      - name: Run focused regression tests
        run: |
          git diff --check
          python3 -m pytest -q tests/test_live_authoring_incremental_refresh.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workcell_builder/workcell_builder/gui/mainwindow.cpp tests/test_live_authoring_incremental_refresh.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Keep live Scene Builder mutations incremental"
          git push origin HEAD:fix/scene-builder-live-authoring-polish
