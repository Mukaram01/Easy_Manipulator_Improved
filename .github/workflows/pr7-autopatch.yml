name: PR7 Autopatch

on:
  push:
    branches:
      - codex/repair-cpp-command-process-warnings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-cpp-command-process-warnings
          fetch-depth: 0

      - name: Apply focused C++ warning repairs
        run: python3 scripts/pr7_apply_patch.py

      - name: Run focused regression tests
        run: >-
          python3 -m pytest
          tests/test_workcell_builder_cpp_warning_repairs.py
          tests/test_check_colcon_build_warnings.py
          -q

      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair C++ command and process warnings"
          git push origin HEAD:codex/repair-cpp-command-process-warnings
