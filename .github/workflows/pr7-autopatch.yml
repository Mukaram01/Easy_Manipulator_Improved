name: PR7 Autopatch

on:
  push:
    branches:
      - codex/repair-cpp-command-process-warnings

permissions:
  contents: write

concurrency:
  group: pr7-autopatch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-cpp-command-process-warnings
          fetch-depth: 0

      - name: Apply PR7 source repairs
        shell: bash
        run: |
          printf '%s' '    ' | base64 --decode > /tmp/apply_pr7.py
          python3 /tmp/apply_pr7.py

      - name: Run focused regression tests
        run: >-
          python3 -m pytest
          tests/test_workcell_builder_cpp_warning_repairs.py
          tests/test_check_colcon_build_warnings.py
          -q

      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workcell_builder/workcell_builder/gui/mainwindow.h
          git add workcell_builder/workcell_builder/gui/mainwindow.cpp
          git add workcell_builder/workcell_builder/gui/scene_select.cpp
          git add tests/test_workcell_builder_cpp_warning_repairs.py
          git commit -m "Repair C++ command and process warnings"
          git push origin HEAD:codex/repair-cpp-command-process-warnings
