robot:
  model: ur5
  planning_group: manipulator
  base_frame: world
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
end_effector:
  id: robotiq_2f
  type: finger
  brand: robotiq
  grasp_frame: ee_palm
  allowed_touch_links: [gripper_finger1_finger_tip_link, gripper_finger2_finger_tip_link]
camera:
  id: realsense_d435i
  type: depth_camera
  frame: camera_depth_optical_frame
  pointcloud_topic: /camera/camera/depth/color/points
  rgb_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
perception:
  mode: online
  notes: Review sensor calibration and frame alignment.
environment:
  frame: world
  support_surfaces:
    - id: table_main
      type: table
      frame: world
      pose_xyz: [0.0, 0.0, 0.0]
      pose_rpy: [0.0, 0.0, 0.0]
      dimensions: [1.0, 1.0, 0.05]
objects:
  - id: commissioning_object
    class: unknown
    shape: box
    color: unknown
    material: unknown
    frame: world
    dimensions: [0.05, 0.05, 0.05]
    pose_xyz: [0.45, 0.0, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
task:
  id: wizard_garbage_sorting_task
  type: garbage_sorting
  source_object: commissioning_object
  destinations:
    - id: recyclable_bin
      frame: world
      pose_xyz: [0.3, -0.3, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
    - id: general_waste_bin
      frame: world
      pose_xyz: [0.3, -0.15, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
    - id: reject_bin
      frame: world
      pose_xyz: [0.3, 0.0, 0.1]
      pose_rpy: [0.0, 0.0, 0.0]
  rules:
    - id: route_recyclable
      when:
        class: recyclable
      destination: recyclable_bin
    - id: route_general
      when:
        class: general
      destination: general_waste_bin
    - id: fallback
      when:
        always: true
      destination: reject_bin
self_test:
  enabled: true
  object_shape: box
  object_dimensions: [0.05, 0.05, 0.05]
  object_pose_xyz: [0.45, 0.0, 0.08]
