schema_version: cell_definition/v1
cell:
  id: ur5_colour_caps
  name: UR5 Colour Sorting with Capabilities
robot:
  model: ur5
  planning_group: manipulator
  base_frame: world
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
  capability: ur5
end_effector:
  id: robotiq_2f
  type: finger
  brand: robotiq
  grasp_frame: tool0
  allowed_touch_links: [left_inner_finger, right_inner_finger]
  capability: robotiq_2f_85
camera:
  id: realsense_d435i
  type: depth_camera
  frame: camera_depth_optical_frame
environment:
  frame: world
  support_surfaces:
    - id: table_main
      type: table
      frame: world
      pose_xyz: [0.0, 0.0, 0.0]
      pose_rpy: [0.0, 0.0, 0.0]
      dimensions: [1.2, 0.8, 0.05]
  assets:
    - capability: table_standard_1200
    - capability: bin_blue_large
objects:
  - id: part1
    class: unknown
    shape: box
    color: red
    material: plastic
    frame: world
    dimensions: [0.04, 0.04, 0.04]
    pose_xyz: [0.45, 0.0, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
task:
  id: colour_sort_task
  type: sort_by_colour
  capability: sort_by_colour
  source_object: part1
  destinations:
    - id: bin_red
      frame: world
      pose_xyz: [0.3, -0.3, 0.1]
      pose_rpy: [0, 0, 0]
    - id: bin_blue
      frame: world
      pose_xyz: [0.3, -0.15, 0.1]
      pose_rpy: [0, 0, 0]
    - id: reject_bin
      frame: world
      pose_xyz: [0.3, 0.0, 0.1]
      pose_rpy: [0, 0, 0]
  rules:
    - id: route_red
      when:
        color: red
      destination: bin_red
    - id: route_blue
      when:
        color: blue
      destination: bin_blue
    - id: fallback
      when:
        always: true
      destination: reject_bin
sensors:
  - capability: intel_realsense_d435i
commissioning:
  self_test_enabled: true
  export_bundle: false
