schema_version: cell_definition/v1
cell:
  id: ur5_shape_sort_cell
  name: UR5 shape sort cell
  description: Sort by shape preview
robot:
  model: ur5
  planning_group: manipulator
  base_frame: world
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
end_effector:
  id: robotiq_2f
  type: finger
  brand: robotiq
  grasp_frame: ee_palm
  allowed_touch_links: [gripper_finger1_finger_tip_link, gripper_finger2_finger_tip_link]
camera:
  id: realsense_d435i
  type: depth_camera
  frame: camera_depth_optical_frame
environment:
  frame: world
  support_surfaces:
    - id: table_main
      type: table
      frame: world
      pose_xyz: [0.0, 0.0, 0.0]
      pose_rpy: [0.0, 0.0, 0.0]
      dimensions: [1.0, 1.0, 0.05]
objects:
  - id: detected_object
    class: part
    shape: cylinder
    color: yellow
    material: plastic
    frame: world
    dimensions: [0.04, 0.04, 0.06]
    pose_xyz: [0.45, 0.0, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
task:
  id: shape_sorting_task
  type: sort_by_shape
  source_object: detected_object
  destinations:
    - id: box_bin
      frame: world
      pose_xyz: [0.35, -0.20, 0.10]
      pose_rpy: [0.0, 0.0, 0.0]
    - id: cylinder_bin
      frame: world
      pose_xyz: [0.35, 0.20, 0.10]
      pose_rpy: [0.0, 0.0, 0.0]
    - id: reject_bin
      frame: world
      pose_xyz: [0.20, 0.0, 0.10]
      pose_rpy: [0.0, 0.0, 0.0]
  rules:
    - id: box_to_box_bin
      when:
        shape: box
      destination: box_bin
    - id: cylinder_to_cylinder_bin
      when:
        shape: cylinder
      destination: cylinder_bin
    - id: fallback
      when:
        always: true
      destination: reject_bin
commissioning:
  self_test_enabled: true
  export_bundle: true
  require_operator_review: true
