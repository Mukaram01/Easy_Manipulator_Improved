schema_version: task_recipe/v1
task:
  id: colour_sort
  type: sort_by_colour
  source: detected_object
  perception_source: overhead_rgbd
  destinations:
    - id: red_bin
      frame: world
      pose_xyz: [0.3, -0.2, 0.1]
      pose_rpy: [0, 0, 0]
      label: red
    - id: blue_bin
      frame: world
      pose_xyz: [0.3, 0.0, 0.1]
      pose_rpy: [0, 0, 0]
      label: blue
    - id: green_bin
      frame: world
      pose_xyz: [0.3, 0.2, 0.1]
      pose_rpy: [0, 0, 0]
      label: green
    - id: unknown_reject_bin
      frame: world
      pose_xyz: [0.2, 0.0, 0.1]
      pose_rpy: [0, 0, 0]
      label: reject
  decision_rules:
    - id: red
      when:
        attribute: colour
        equals: red
      destination: red_bin
    - id: blue
      when:
        attribute: colour
        equals: blue
      destination: blue_bin
    - id: green
      when:
        attribute: colour
        equals: green
      destination: green_bin
    - id: fallback
      when:
        default: true
      destination: unknown_reject_bin
