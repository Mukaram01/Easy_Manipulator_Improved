schema_version: cell_definition/v1
cell:
  id: ur5_2f_demo_cell
  name: UR5 2F demo cell
  description: Example generated cell definition
robot:
  model: ur5
  planning_group: manipulator
  base_frame: world
  tool_link: tool0
  home_named_target: home
  safe_joint_state: []
end_effector:
  id: robotiq_2f
  type: finger
  brand: robotiq
  grasp_frame: ee_palm
  allowed_touch_links:
    - gripper_finger1_finger_tip_link
    - gripper_finger2_finger_tip_link
camera:
  id: realsense_d435i
  type: depth_camera
  frame: camera_depth_optical_frame
  pointcloud_topic: /camera/camera/depth/color/points
  rgb_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
environment:
  frame: world
  support_surfaces:
    - id: table_main
      type: table
      frame: world
      pose_xyz: [0.0, 0.0, 0.0]
      pose_rpy: [0.0, 0.0, 0.0]
      dimensions: [1.0, 1.0, 0.05]
objects:
  - id: commissioning_box
    class: box
    shape: box
    color: unknown
    material: unknown
    frame: world
    dimensions: [0.05, 0.05, 0.05]
    pose_xyz: [0.45, 0.0, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
task:
  id: default_task
  type: pick_place
  source_object: commissioning_box
  destinations:
    - id: default_drop_zone
      frame: world
      pose_xyz: [0.30, -0.30, 0.10]
      pose_rpy: [0.0, 0.0, 0.0]
  rules:
    - id: default_place
      when:
        always: true
      destination: default_drop_zone
commissioning:
  self_test_enabled: true
  export_bundle: true
  require_operator_review: true
