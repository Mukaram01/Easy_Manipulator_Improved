# Workcell Builder generated scene manifest contract template.
#
# This template is offline/commissioning focused and should remain safe by default.
# Generated metadata is a commissioning starting point, not a safety certificate
# and not proof of physical reachability.

schema_version: 1.0

generated_defaults:
  review_required: true
  notes:
    - Generated by workcell_builder commissioning template.
    - Tune poses, links, and recipe decisions before runtime use.

scene:
  name: scene_name_here

robot:
  model: robot_model_here
  planning_group: manipulator
  base_frame: base_link
  ee_link: tool0
  # Populate when available from generated robot metadata.
  home_named_target: home

planning:
  pipeline: ompl
  planner_id: RRTConnectkConfigDefault

end_effector:
  # one of: finger, suction, unknown
  type: finger
  brand: generated_unknown
  grasp_frame: tool0
  # Finger grippers: include fingertip links when available.
  # Suction: set to suction contact links when known.
  # Unknown end effectors: keep this placeholder and review.
  allowed_touch_links:
    - tool0

frames:
  world: world
  robot_base: base_link
  grasp_frame: tool0
  support_surface_frame: world

environment:
  support_surface_link: table

objects:
  support_surfaces:
    - id: primary_table
      frame_id: world
      pose_xyz: [0.45, 0.0, 0.0]
      pose_rpy: [0.0, 0.0, 0.0]
      dimensions: [1.20, 0.80, 0.05]

self_test:
  enabled: true
  object:
    id: commissioning_box
    shape: box
    frame_id: world
    dimensions: [0.05, 0.05, 0.05]
    # If scene geometry is available, generator should compute/tune this pose.
    pose_xyz: [0.45, 0.0, 0.08]
    pose_rpy: [0.0, 0.0, 0.0]
    attributes:
      color: unknown
      shape: box
      material: unknown
      class: commissioning
  expected:
    min_grasp_candidates: 1
    allow_simulated_execution: true

task_recipe:
  enabled: true
  id: generated_default_pick_place
  name: Generated Default Pick Place
  type: pick_place
  description: Generated default commissioning recipe. Review and tune before runtime use.
  pick:
    object_source: self_test
  decision_rules:
    - id: default_place
      when:
        default: true
      destination: default_drop_zone
      action: place
  destinations:
    - id: default_drop_zone
      frame_id: world
      pose_xyz: [0.30, -0.30, 0.10]
      pose_rpy: [0.0, 0.0, 0.0]
      action: place
  expected:
    allow_fallback_rule: true
    require_destination_pose: true

home_return:
  enabled: true
  strategy: named_target_or_safe_joint_state
  named_target: home
  # Generator should populate neutral/zero vector if robot joint count is known.
  # Must always remain present, even if empty.
  safe_joint_state: []
