schema_version: end_effector_capability/v1
end_effector:
  id: robotiq_3f
  label: Robotiq 3F
  family: three_finger_gripper
  compatible_robot_families: [serial_6_axis, collaborative_6_axis]
  required_frames: [tool0]
  grasp_frames: [tool0, palm_link]
  contact_links: [finger_a, finger_b, finger_c]
  allowed_touch_links: [finger_a, finger_b, finger_c]
  max_object_mass_kg: 1.5
  opening_width_mm: 155
  supported_grasp_strategies: [pinch, enveloping]
  required_io_signals: [mode_cmd, grip_cmd]
  release_behaviour: adaptive_release
  limitations_warnings:
    - Enveloping grasp speed is slower than pinch mode.
  hold:
    schema: end_effector_hold/v1
    method: multi_contact
    contact_verification:
      min_contact_links: 2              # two opposing fingers prove a pinch; three an envelope
    hold_reserve_rad: 0.002
    actuation:
      kind: single_actuated_joint
      grasp_force_range_n: [15, 60]     # Robotiq 3-Finger specification (per finger)
      commanded_grasp_force_n: 30
      pad_force_per_actuator_torque:
        n_per_nm: 1.0                   # placeholder until measured on a commissioned cell
        measured_closure_rad: 0.0
        evidence: unmeasured; commissioning fails closed on the simulator until bound
    release: adaptive_release
