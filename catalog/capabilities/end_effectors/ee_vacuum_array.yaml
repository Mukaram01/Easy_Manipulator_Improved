schema_version: end_effector_capability/v1
end_effector:
  id: generic_vacuum_array
  label: Generic Vacuum Array
  family: vacuum_array
  compatible_robot_families: [gantry, delta, serial_6_axis]
  required_frames: [tool0]
  grasp_frames: [array_center]
  contact_links: [cup_1, cup_2, cup_3, cup_4]
  allowed_touch_links: [cup_1, cup_2, cup_3, cup_4]
  max_object_mass_kg: 8.0
  suction_area_mm2: 8500
  supported_grasp_strategies: [top_down_suction]
  required_io_signals: [vacuum_zone_a, vacuum_zone_b]
  release_behaviour: staged_zone_release
  limitations_warnings:
    - Needs flat target contact area for all active cups.
  hold:
    schema: end_effector_hold/v1
    method: vacuum_seal
    vacuum:
      seal_contact_links: all
      vacuum_signal: vacuum_zone_a
      supply_vacuum_kpa: 60
      effective_area_mm2: 8500
      simulator_support: none
    release: staged_zone_release
  interface:
    schema: end_effector_interface/v1
    kind: io_signal
    grasp_capabilities: [suction]
    signals: {engage: vacuum_zone_a, release: vacuum_zone_a, feedback: vacuum_zone_a, release_mode: deassert}
    touch_links: [cup_1, cup_2, cup_3, cup_4]
    tcp_link: array_center
    recovery: {strategy: stop_and_require_operator, release_outside_destination: false}
