schema_version: end_effector_capability/v1
end_effector:
  id: robotiq_2f_85
  label: Robotiq 2F-85
  family: finger_gripper
  compatible_robot_families:
  - serial_6_axis
  - collaborative_6_axis
  - scara
  required_frames:
  - tool0
  grasp_frames:
  - tool0
  contact_links:
  - left_inner_finger
  - right_inner_finger
  allowed_touch_links:
  - left_inner_finger
  - right_inner_finger
  max_object_mass_kg: 2.0
  opening_width_mm: 85
  supported_grasp_strategies:
  - pinch
  - side_pick
  required_io_signals:
  - gripper_open_cmd
  - gripper_close_cmd
  release_behaviour: open_until_clear
  limitations_warnings:
  - Requires parallel approach for reliable pinch grasps.
  support_status: supported
  runtime_status: supported
  asset_package: robotiq_85_description
  urdf_or_xacro: assets/end_effectors/robotiq_85_gripper/robotiq_85_description/urdf/robotiq_85_gripper.urdf.xacro
  moveit_config_package: robotiq_85_moveit_config
  fake_hardware_status: ready
  real_hardware_status: optional_later
  driver_status: optional_later
  category: tool
  display_name: Robotiq 2F-85
  tcp_frame: tool0
  compatible_grasp_strategies:
  - finger_top
  - auto
  - finger_pinch_basic
  # Physical hold profile consumed by the execution architecture (end_effector_hold/v1).
  # The 2F-85 pads are driven through a rigid linkage by one actuated joint, so the
  # simulated actuator torque cap sets the saturated per-pad grasp force.
  hold:
    schema: end_effector_hold/v1
    method: opposing_contact
    contact_verification:
      min_contact_links: all            # both pads measured against the target
    hold_reserve_rad: 0.002             # measured-contact hold (LENLEG 2026-10-24, bbe4f433)
    actuation:
      kind: single_actuated_joint
      grasp_force_range_n: [20, 235]    # Robotiq 2F-85 specification
      commanded_grasp_force_n: 20       # = the default force variant below
      # Stage-A experimental force settings (LENLEG 2026-10-24, 15-run functional report). Neither is
      # qualified as reliable or universally suitable; a cell selects one with end_effector.hold_variant.
      default_force_variant: stage_a_20n
      force_variants:
        stage_a_20n:
          commanded_grasp_force_n: 20
          status: experimental
          evidence: "LENLEG 2026-10-24 functional batch force20: 0/5 complete; 3 lost in transfer, 2 seated then a pad unloaded"
        stage_a_90n:
          commanded_grasp_force_n: 90.4
          status: experimental
          evidence: "LENLEG 2026-10-24 functional batches force90/force90b: 2/10 sequences complete, 1 functional pass, 0 strict"
      pad_force_per_actuator_torque:
        n_per_nm: 8.94                  # measured 90.4 N @ 10.114 N m, 39.6 N @ 4.474, 20.0 N @ 2.237 (linear within 1 %)
        measured_closure_rad: 0.5848
        evidence: LENLEG 2026-10-24 transmitted joint wrenches, stage_a1_finish_lenleg_hold_full4 and targeted stationary runs force40_st1 / force20_st1
    release: open_until_clear
  # Physics-simulator contact geometry (simulation_collision.py). The fingertip collision mesh
  # (2436 concave triangles) makes DART+Bullet pad contact collapse and the part rotate in the
  # grip at any speed and force. Slab bounding boxes of the same mesh (cut just before the flat
  # pad face, x 7.0-44.5 mm) keep the real pad face, enclose the mesh and hold.
  simulator_collision:
    mode: mesh_slab_bounding_boxes
    axis: x
    cuts_m: [0.0069]
    links: [gripper_finger1_finger_tip_link, gripper_finger2_finger_tip_link]
    evidence: "LENLEG 2026-10-24 standalone DART replay of stage_a1_release_gate_full1 transfer (scripts/simulator_physics_repro/pinch_replay.cpp): mesh pads 2.6-104 mrad with ~0 N pad force; slab-box pads 0.0016-0.0022 mrad, no collapse (0.25x-2x speed, 20/90 N); whole-tip box rejected by grasp qualification (1.014 mm > 1 mm)"
  # How the task pipeline drives this tool (end_effector_interface/v1). Values are the Robotiq
  # 2F-85 description's own (robotiq_85_description): gripper_finger1_joint 0..0.804 rad, group
  # "gripper" in robotiq_85_moveit_config, fingertip links carry collision meshes.
  interface:
    schema: end_effector_interface/v1
    kind: joint_position
    grasp_capabilities: [two_finger_parallel]
    planning_group: gripper
    command_joints: [gripper_finger1_joint]
    open_positions_rad: {gripper_finger1_joint: 0.0}
    closure:
      closed_position_rad: 0.804
      search_steps: 80
    max_aperture_m: 0.085
    touch_links: [gripper_finger1_finger_tip_link, gripper_finger2_finger_tip_link]
    tcp_link: ee_palm
    recovery: {strategy: stop_and_require_operator, release_outside_destination: false}
